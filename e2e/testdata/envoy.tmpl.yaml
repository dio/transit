                      filter_name: e2e-embedded-server
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: embedded_server_e2e
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: embedded-server-local }

    # stream-complete-e2e: exercises up.WithOnStreamComplete. The filter logs an
    # increment to its loopback counter on every stream termination; the loopback
    # cluster serves "ok" so requests succeed.
    - name: stream-complete-e2e
      address:
        socket_address: { address: 0.0.0.0, port_value: {{.StreamCompletePort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: stream_complete_e2e
