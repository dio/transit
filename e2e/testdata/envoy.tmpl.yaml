    # async-callout-local-response-e2e: same e2e-async-callout filter but routes
    # to the recorder instead of the echo upstream. Used to prove that a callout
    # callback that calls SendLocalResponse does not forward the request upstream.
    - name: async-callout-local-response-e2e
      address:
        socket_address: { address: 0.0.0.0, port_value: {{.AsyncCalloutLocalResponsePort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: async_callout_local_response_e2e
                http_filters:
                  - name: e2e-async-callout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: e2e
                      filter_name: e2e-async-callout
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: async_callout_local_response_e2e
