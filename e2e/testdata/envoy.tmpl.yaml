    - name: stream-finalized-e2e
      address:
        socket_address: { address: 0.0.0.0, port_value: {{.StreamFinalizedPort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: stream_finalized_e2e
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.dynamic_modules
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.dynamic_modules.v3.DynamicModuleAccessLog
                      dynamic_module_config:
                        name: e2e
                      logger_name: e2e-stream-finalized
                      logger_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{}'
                http_filters:
                  - name: e2e-stream-finalized
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: e2e
                      filter_name: e2e-stream-finalized
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: stream_finalized_e2e
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: stream-complete-local }

    - name: stream-finalized-dead-e2e
      address:
        socket_address: { address: 0.0.0.0, port_value: {{.StreamFinalizedDeadPort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: stream_finalized_dead_e2e
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.dynamic_modules
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.dynamic_modules.v3.DynamicModuleAccessLog
                      dynamic_module_config:
                        name: e2e
                      logger_name: e2e-stream-finalized
                      logger_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{}'
                http_filters:
                  - name: e2e-stream-finalized
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: e2e
                      filter_name: e2e-stream-finalized
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: stream_finalized_dead_e2e
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: dead-upstream }

    - name: stream-finalized-local-e2e
      address:
        socket_address: { address: 0.0.0.0, port_value: {{.StreamFinalizedLocalPort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: stream_finalized_local_e2e
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.dynamic_modules
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.dynamic_modules.v3.DynamicModuleAccessLog
                      dynamic_module_config:
