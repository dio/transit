    # embedded-server-e2e: proves the RegisterWithGroup + net.Listen embedded
    # server pattern. The e2e-embedded-server filter starts a loopback net/http
    # server; Envoy routes requests to it via a STATIC cluster.
    - name: embedded-server-e2e
      address:
        socket_address: { address: 0.0.0.0, port_value: {{.EmbeddedServerPort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
