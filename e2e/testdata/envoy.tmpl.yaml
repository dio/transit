    - name: openai-cluster-provided-h2-e2e
      address:
        socket_address: { address: 127.0.0.1, port_value: {{.OpenAIClusterProvidedPort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: openai_cluster_provided_h2_e2e
                scheme_header_transformation:
                  match_upstream: true
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: openai_cluster_provided_h2_e2e
                  virtual_hosts:
                    - name: openai
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: openai-cluster-provided-h2-upstream
                            host_rewrite_literal: api.openai.com
                            timeout: 30s

{{- end }}
  clusters:
    - name: compress-upstream
      connect_timeout: 5s
      type: STATIC
      load_assignment:
        cluster_name: compress-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.CompressUpstreamPort}} }

    - name: async-callout-upstream
      connect_timeout: 5s
      type: STATIC
      load_assignment:
        cluster_name: async-callout-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.AsyncCalloutUpstreamPort}} }

    - name: async-callout-forward-upstream
      connect_timeout: 5s
      type: STATIC
      load_assignment:
        cluster_name: async-callout-forward-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.AsyncCalloutForwardUpstreamPort}} }

    - name: grpc-callout-upstream
      connect_timeout: 5s
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc-callout-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.GRPCCalloutUpstreamPort}} }

    - name: mutable-body-recorder
      connect_timeout: 5s
      type: STATIC
      load_assignment:
        cluster_name: mutable-body-recorder
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.MutableBodyRecorderPort}} }

    # dead-upstream: nothing listens on DeadUpstreamPort. Envoy gets ECONNREFUSED
    # and sets UF (upstream connection failure) response flags.
    - name: dead-upstream
      connect_timeout: 1s
      type: STATIC
      load_assignment:
        cluster_name: dead-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.DeadUpstreamPort}} }

    - name: upstream-filter-upstream
      connect_timeout: 5s
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: e2e-upstream
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: e2e
                filter_name: e2e-upstream
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      load_assignment:
        cluster_name: upstream-filter-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.UpstreamFilterUpstreamPort}} }

    - name: upstream-auth-upstream
      connect_timeout: 5s
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: e2e-upstream-auth
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: e2e
                filter_name: e2e-upstream-auth
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      load_assignment:
        cluster_name: upstream-auth-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.UpstreamFilterUpstreamPort}} }

    - name: upstream-auth-h2c-upstream
      connect_timeout: 5s
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
          http_filters:
            - name: e2e-upstream-auth
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: e2e
                filter_name: e2e-upstream-auth
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      load_assignment:
        cluster_name: upstream-auth-h2c-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.UpstreamAuthH2CUpstreamPort}} }

    - name: upstream-auth-h2-tls-upstream
      connect_timeout: 5s
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
          http_filters:
            - name: e2e-upstream-auth
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: e2e
                filter_name: e2e-upstream-auth
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      load_assignment:
        cluster_name: upstream-auth-h2-tls-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.UpstreamAuthH2TLSUpstreamPort}} }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: upstream-auth-h2.local
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: "{{.UpstreamAuthH2TLSCAPath}}"

    - name: upstream-auth-group-upstream
      connect_timeout: 5s
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: e2e-upstream-auth-group
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: e2e
                filter_name: e2e-upstream-auth-group
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      load_assignment:
        cluster_name: upstream-auth-group-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.UpstreamFilterUpstreamPort}} }

    - name: als-sink
      connect_timeout: 5s
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: als-sink
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.AlsSinkPort}} }

    - name: otel-collector
      connect_timeout: 5s
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: otel-collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.OtelSinkPort}} }

    - name: lb-policy-upstream
      connect_timeout: 5s
      type: STATIC
      lb_policy: LOAD_BALANCING_POLICY_CONFIG
      load_balancing_policy:
        policies:
          - typed_extension_config:
              name: envoy.load_balancing_policies.dynamic_modules
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.load_balancing_policies.dynamic_modules.v3.DynamicModulesLoadBalancerConfig
                dynamic_module_config:
                  name: e2e
                lb_policy_name: first-host
      load_assignment:
        cluster_name: lb-policy-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.LbPolicyUpstreamPort}} }

    # lb-policy-two-hosts: two endpoints for host-selection assertion. The
    # first-host policy must always pick index=0 (lb-host-0); index=1 (lb-host-1)
    # should never be reached.
    - name: lb-policy-two-hosts
      connect_timeout: 5s
      type: STATIC
      lb_policy: LOAD_BALANCING_POLICY_CONFIG
      load_balancing_policy:
        policies:
          - typed_extension_config:
              name: envoy.load_balancing_policies.dynamic_modules
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.load_balancing_policies.dynamic_modules.v3.DynamicModulesLoadBalancerConfig
                dynamic_module_config:
                  name: e2e
                lb_policy_name: first-host
      load_assignment:
        cluster_name: lb-policy-two-hosts
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.LbPolicyHost0Port}} }
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.LbPolicyHost1Port}} }

    - name: cluster-extension-upstream
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: e2e
          cluster_name: static-hosts
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{"hosts":[{"address":"127.0.0.1:{{.ClusterExtensionUpstreamPort}}"}]}'

    - name: cluster-scheduler-probe
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: e2e
          cluster_name: scheduler-probe
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{}'

    # cluster-tls-upstream: same static-hosts cluster extension but with a TLS
    # transport socket. The Go filter (cluster.go) is unchanged. TLS, SNI, and
    # certificate validation are Envoy cluster-level concerns.
    - name: cluster-tls-upstream
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: e2e
          cluster_name: static-hosts
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{"hosts":[{"address":"127.0.0.1:{{.ClusterExtensionTLSUpstreamPort}}"}]}'
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: cluster-tls.local
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: "{{.ClusterExtensionTLSCAPath}}"
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: cluster-tls.local

    - name: cluster-h2-tls-auth-upstream
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
          http_filters:
            - name: e2e-upstream-auth
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: e2e
                filter_name: e2e-upstream-auth
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: e2e
          cluster_name: static-hosts
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{"hosts":[{"address":"127.0.0.1:{{.ClusterExtensionTLSUpstreamPort}}"}]}'
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: cluster-tls.local
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: "{{.ClusterExtensionTLSCAPath}}"
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: cluster-tls.local

    # cluster-mtls-upstream: same static-hosts cluster extension, but Envoy also
    # presents a client certificate. The upstream requires that client
    # certificate, so the test proves the cluster can carry mTLS config without
    # changing the Go host discovery logic.
    - name: cluster-mtls-upstream
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: e2e
          cluster_name: static-hosts
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{"hosts":[{"address":"127.0.0.1:{{.ClusterExtensionMTLSUpstreamPort}}"}]}'
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: cluster-mtls.local
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: "{{.ClusterExtensionMTLSClientCertPath}}"
                private_key:
                  filename: "{{.ClusterExtensionMTLSClientKeyPath}}"
            validation_context:
              trusted_ca:
                filename: "{{.ClusterExtensionMTLSCAPath}}"
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: cluster-mtls.local

    - name: embedded-server-local
      connect_timeout: 5s
      type: STATIC
      load_assignment:
        cluster_name: embedded-server-local
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.EmbeddedServerLoopbackPort}} }

    - name: stream-complete-local
      connect_timeout: 5s
      type: STATIC
      load_assignment:
        cluster_name: stream-complete-local
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.StreamCompleteLoopbackPort}} }

{{- if .OpenAIClusterProvidedEnabled }}
    - name: openai-cluster-provided-h2-upstream
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          auto_host_sni: true
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options:
            max_requests_per_connection: 1
          explicit_http_config:
            http2_protocol_options: {}
          http_filters:
            - name: e2e-openai-probe
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: e2e
                filter_name: e2e-openai-probe
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: e2e
          cluster_name: static-hosts
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{"hosts":[{"address":"api.openai.com:443","hostname":"api.openai.com"}]}'

{{- end }}
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: {{.AdminPort}} }

stats_flush_interval: 1s
stats_sinks:
  - name: envoy.stat_sinks.open_telemetry
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.stat_sinks.open_telemetry.v3.SinkConfig
      grpc_service:
        envoy_grpc:
          cluster_name: otel-collector
      report_counters_as_deltas: false

tracing:
  http:
    name: envoy.tracers.opentelemetry
    typed_config:
      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
      grpc_service:
        envoy_grpc:
          cluster_name: otel-collector
      service_name: "transit-e2e"
