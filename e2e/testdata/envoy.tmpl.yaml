                  - name: e2e-stream-complete
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: e2e
                      filter_name: e2e-stream-complete
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: stream_complete_e2e
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: stream-complete-local }

    # stream-finalized-e2e: exercises up.WithOnStreamFinalized. The filter is
    # paired with the SDK-auto-registered access logger (logger_name matches
    # filter_name). Three listeners share the same filter — one routing to a
    # live upstream, one to dead-upstream (UF flag), one with the guard filter
