static_resources:
  listeners:
    - name: cluster-async-router
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: cluster-async-router
                http_filters:
                  - name: body-router-writer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: cluster-async-router
                      filter_name: body-router-writer
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: upstream }

  clusters:
    - name: upstream
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      # Per-host TLS contexts keyed on host metadata "sni".
      # Hosts added via the dynamic-module cluster carry metadata under the
      # envoy.transport_socket_match namespace (see HostSpec.Metadata). Envoy
      # matches each host against the entries below and applies the corresponding
      # UpstreamTlsContext — giving each upstream its own SNI without a separate
      # cluster per provider.
      transport_socket_matches:
        - name: httpbin
          match:
            sni: httpbin.org
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: httpbin.org
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: /etc/ssl/cert.pem
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: httpbin.org
        - name: example
          match:
            sni: example.com
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: example.com
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: /etc/ssl/cert.pem
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: example.com
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: cluster-async-router
          cluster_name: body-router-cluster
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{"hosts":[{"name":"a","address":"httpbin.org:443","sni":"httpbin.org"},{"name":"b","address":"example.com:443","sni":"example.com"}]}'

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
