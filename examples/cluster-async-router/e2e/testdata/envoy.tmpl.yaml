static_resources:
  listeners:
    - name: cluster-async-router
      address:
        socket_address: { address: 127.0.0.1, port_value: {{.ProxyPort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: cluster-async-router
                http_filters:
                  - name: body-router-writer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: cluster-async-router
                      filter_name: body-router-writer
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: cluster-async-router
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: upstream }

  clusters:
    - name: upstream
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      transport_socket_matches:
        - name: host-c
          match:
            sni: host-c.test
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: host-c.test
              common_tls_context:
                validation_context:
                  trusted_ca: { filename: {{.CAFile}} }
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: { exact: host-c.test }
        - name: host-d
          match:
            sni: host-d.test
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: host-d.test
              common_tls_context:
                validation_context:
                  trusted_ca: { filename: {{.CAFile}} }
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: { exact: host-d.test }
{{- if .Public}}
        - name: httpbin
          match:
            sni: httpbin.org
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: httpbin.org
              common_tls_context:
                validation_context:
                  trusted_ca: { filename: {{.SystemCAFile}} }
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: { exact: httpbin.org }
        - name: example
          match:
            sni: example.com
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: example.com
              common_tls_context:
                validation_context:
                  trusted_ca: { filename: {{.SystemCAFile}} }
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: { exact: example.com }
{{- end}}
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: cluster-async-router
          cluster_name: body-router-cluster
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{"hosts":[{"name":"a","address":"127.0.0.1:{{.UpstreamAPort}}"},{"name":"b","address":"127.0.0.1:{{.UpstreamBPort}}"},{"name":"c","address":"127.0.0.1:{{.UpstreamCPort}}","sni":"host-c.test"},{"name":"d","address":"127.0.0.1:{{.UpstreamDPort}}","sni":"host-d.test"}{{if .Public}},{"name":"httpbin","address":"httpbin.org:443","sni":"httpbin.org"},{"name":"example","address":"example.com:443","sni":"example.com"}{{end}}]}'

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: {{.AdminPort}} }
