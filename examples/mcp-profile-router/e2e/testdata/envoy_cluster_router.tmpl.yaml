admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: {{ .AdminPort }}

static_resources:
  listeners:
  - name: mcp-profile-router
    address:
      socket_address:
        address: 127.0.0.1
        port_value: {{ .ProxyPort }}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: mcp_profile_router
          http_filters:
          - name: mcp-profile-router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              dynamic_module_config:
                name: mcp-profile-router-combo
              filter_name: mcp-profile-router
              filter_config:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: '{}'
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: profile_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: mcp-blackhole

  - name: mcp-cluster-router-egress
    address:
      socket_address:
        address: 127.0.0.1
        port_value: {{ .EgressPort }}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: mcp_cluster_router_egress
          http_filters:
          - name: cluster-router-debug
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              dynamic_module_config:
                name: mcp-profile-router-combo
              filter_name: cluster-router-debug
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: egress_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: mcp-cluster-router

  clusters:
  - name: mcp-cluster-router
    connect_timeout: 5s
    lb_policy: CLUSTER_PROVIDED
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http_protocol_options: {}
        http_filters:
        - name: cluster-router-upstream
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
            dynamic_module_config:
              name: mcp-profile-router-combo
            filter_name: cluster-router-upstream
        - name: envoy.filters.http.upstream_codec
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
    cluster_type:
      name: envoy.clusters.dynamic_modules
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
        dynamic_module_config:
          name: mcp-profile-router-combo
        cluster_name: cluster-router
        cluster_config:
          "@type": type.googleapis.com/google.protobuf.StringValue
          value: '{{ .ClusterConfigJSON }}'

  - name: mcp-blackhole
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: mcp-blackhole
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 1
