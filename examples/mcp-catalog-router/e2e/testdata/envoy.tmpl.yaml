static_resources:
  listeners:
  - name: mcp-catalog-router
    address:
      socket_address:
        address: 127.0.0.1
        port_value: {{ .ProxyPort }}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: mcp_catalog_router
          http_filters:
          - name: mcp-catalog-router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              dynamic_module_config:
                name: mcp-catalog-router
              filter_name: mcp-catalog-router
              filter_config:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: '{}'
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local
            virtual_hosts:
            - name: local
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: mcp-blackhole

  clusters:
  - name: mcp-blackhole
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: mcp-blackhole
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 1

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: {{ .AdminPort }}
