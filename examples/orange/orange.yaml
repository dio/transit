llm:
  models:
    claude-haiku-4-5:
      provider: anthropic
      name: claude-haiku-4-5-20251001
      endpoints:
        chat_completions: anthropic_openai_compat
    claude-haiku-4-5-20251001:
      provider: anthropic
    text-embedding-3-small:
      provider: openai
      metadata:
        description: "OpenAI text-embedding-3-small (1536 dimensions)."
        tags: ["embeddings"]
    text-embedding-3-large:
      provider: openai
      metadata:
        description: "OpenAI text-embedding-3-large (3072 dimensions)."
        tags: ["embeddings"]
    text-embedding-ada-002:
      provider: openai
      metadata:
        description: "OpenAI text-embedding-ada-002 (1536 dimensions, legacy)."
        tags: ["embeddings"]
    dall-e-2:
      provider: openai
      metadata:
        description: "DALL-E 2 image generation via OpenAI."
        tags: ["images"]
    dall-e-3:
      provider: openai
      metadata:
        description: "DALL-E 3 image generation via OpenAI."
        tags: ["images"]
    gpt-image-1:
      provider: openai
      metadata:
        description: "GPT Image 1 image generation via OpenAI (token-based pricing)."
        tags: ["images"]
    gemini-2.5-flash-image:
      provider: gemini
      metadata:
        description: "Gemini 2.5 Flash image generation via Google AI Studio."
        tags: ["images"]
    gpt-4o-mini:
      provider: openai
      metadata:
        description: "GPT-4o mini via OpenAI."
        context_length: 128000
        max_tokens: 16384
        tags: ["chat", "responses", "fast", "vision"]
    gemini-2.5-flash:
      provider: gemini
      metadata:
        description: "Gemini 2.5 Flash via Google Generative Language API (API key)."
        context_length: 1048576
        tags: ["chat", "fast", "vision"]
    vertex/gemini-2.5-flash:
      provider: vertex
      name: gemini-2.5-flash
      metadata:
        description: "Gemini 2.5 Flash via GCP Vertex AI (service account)."
        context_length: 1048576
        tags: ["chat", "fast", "vision"]
    vertex/claude-opus-4:
      provider: vertex_anthropic
      name: claude-opus-4@20250514
      metadata:
        description: "Claude Opus 4 via GCP Vertex AI (service account)."
        context_length: 200000
        tags: ["chat"]
    amazon.nova-lite-v1:0:
      provider: bedrock
      metadata:
        description: "Amazon Nova Lite via AWS Bedrock."
        context_length: 300000
        tags: ["chat", "fast", "vision"]
    amazon.nova-micro-v1:0:
      provider: bedrock
      metadata:
        description: "Amazon Nova Micro via AWS Bedrock."
        context_length: 128000
        tags: ["chat", "fast"]
  providers:
    anthropic:
      kind: anthropic
      endpoint: https://api.anthropic.com
      extra:
        anthropic_version: "2023-06-01"
      auth:
        type: anthropic
        secret_ref: env://ANTHROPIC_API_KEY

    anthropic_openai_compat:
      kind: openai
      endpoint: https://api.anthropic.com
      auth:
        type: bearer
        secret_ref: env://ANTHROPIC_API_KEY

    openai:
      kind: openai
      endpoint: https://api.openai.com
      auth:
        type: bearer
        secret_ref: env://OPENAI_API_KEY

    gemini:
      kind: openai
      backend_schema: gcpvertexai
      endpoint: https://generativelanguage.googleapis.com
      auth:
        type: gemini
        secret_ref: env://GEMINI_API_KEY

    vertex:
      kind: openai
      backend_schema: gcpvertexai
      endpoint: https://us-central1-aiplatform.googleapis.com
      extra:
        gcp_project: env://GCP_PROJECT
        gcp_location: us-central1
      auth:
        type: gcp
        secret_ref: env://GCP_SERVICE_ACCOUNT_JSON

    vertex_anthropic:
      kind: anthropic
      backend_schema: gcpanthropic
      endpoint: https://us-east5-aiplatform.googleapis.com
      extra:
        anthropic_version: "vertex-2023-10-16"
        gcp_project: env://GCP_PROJECT
        gcp_location: us-east5
      auth:
        type: gcp
        secret_ref: env://GCP_SERVICE_ACCOUNT_JSON

    bedrock:
      kind: openai
      backend_schema: awsbedrock
      endpoint: https://bedrock-runtime.us-east-1.amazonaws.com
      extra:
        aws_region: us-east-1
      auth:
        type: aws

mcp:
  profiles:
    default:
      tools:
        kiwi:
          include: ["search-flight"]
        aws-knowledge:
          include: ["read_documentation", "search_documentation"]
          optional: true  # session succeeds even if aws-knowledge is unreachable
        github:
          include: ["search_repositories"]
          optional: true  # session succeeds even if github is unreachable
      auth:
        github:
          type: bearer
          secret_ref: env://GITHUB_TOKEN
    kiwi-only:
      tools:
        kiwi: {}
  servers:
    kiwi:
      endpoint: https://mcp.kiwi.com
      namespace: kiwi
      tools:
        include: ["search-flight"]
    aws-knowledge:
      endpoint: https://knowledge-mcp.global.api.aws
      namespace: aws
      tools:
        include: ["read_documentation", "search_documentation"]
    github:
      endpoint: https://api.githubcopilot.com/mcp/
      namespace: github
      auth:
        type: bearer
        secret_ref: env://GITHUB_TOKEN # This to be used as default, but profile's secret_ref can override it.
      tools:
        include: ["search_repositories", "get_file_contents"]
