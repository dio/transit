llm:
  models:
    claude-haiku-4-5:
      provider: anthropic
      name: claude-haiku-4-5-20251001
      endpoint_overrides:
        chat_completions: anthropic_openai_compat
      pricing:
        input_mtok: 0.80
        output_mtok: 4.00
        cache_read_mtok: 0.08
        cache_write_mtok: 1.00
    claude-haiku-4-5-20251001:
      provider: anthropic
      pricing:
        input_mtok: 0.80
        output_mtok: 4.00
        cache_read_mtok: 0.08
        cache_write_mtok: 1.00
    text-embedding-3-small:
      provider: openai
      metadata:
        description: "OpenAI text-embedding-3-small (1536 dimensions)."
        tags: ["embeddings"]
    text-embedding-3-large:
      provider: openai
      metadata:
        description: "OpenAI text-embedding-3-large (3072 dimensions)."
        tags: ["embeddings"]
    text-embedding-ada-002:
      provider: openai
      metadata:
        description: "OpenAI text-embedding-ada-002 (1536 dimensions, legacy)."
        tags: ["embeddings"]
    dall-e-2:
      provider: openai
      metadata:
        description: "DALL-E 2 image generation via OpenAI."
        tags: ["images"]
    dall-e-3:
      provider: openai
      metadata:
        description: "DALL-E 3 image generation via OpenAI."
        tags: ["images"]
    gpt-image-1:
      provider: openai
      metadata:
        description: "GPT Image 1 image generation via OpenAI (token-based pricing)."
        tags: ["images"]
    gemini-2.5-flash-image:
      provider: gemini
      metadata:
        description: "Gemini 2.5 Flash image generation via Google AI Studio."
        tags: ["images"]
    gpt-4o-mini:
      provider: openai
      metadata:
        description: "GPT-4o mini via OpenAI."
        context_length: 128000
        max_tokens: 16384
        tags: ["chat", "responses", "fast", "vision"]
    gemini-2.5-flash:
      provider: gemini
      metadata:
        description: "Gemini 2.5 Flash via Google Generative Language API (API key)."
        context_length: 1048576
        tags: ["chat", "fast", "vision"]
    vertex/gemini-2.5-flash:
      provider: vertex
      name: gemini-2.5-flash
      metadata:
        description: "Gemini 2.5 Flash via GCP Vertex AI (service account)."
        context_length: 1048576
        tags: ["chat", "fast", "vision"]
    vertex/claude-opus-4:
      provider: vertex_anthropic
      name: claude-opus-4@20250514
      metadata:
        description: "Claude Opus 4 via GCP Vertex AI (service account)."
        context_length: 200000
        tags: ["chat"]
    amazon.nova-lite-v1:0:
      provider: bedrock
      metadata:
        description: "Amazon Nova Lite via AWS Bedrock."
        context_length: 300000
        tags: ["chat", "fast", "vision"]
    amazon.nova-micro-v1:0:
      provider: bedrock
      metadata:
        description: "Amazon Nova Micro via AWS Bedrock."
        context_length: 128000
        tags: ["chat", "fast"]
  providers:
    anthropic:
      kind: anthropic
      endpoint: https://api.anthropic.com
      extra:
        anthropic_version: "2023-06-01"
      auth:
        type: anthropic
        secret_ref: env://ANTHROPIC_API_KEY

    anthropic_openai_compat:
      kind: openai
      endpoint: https://api.anthropic.com
      auth:
        type: bearer
        secret_ref: env://ANTHROPIC_API_KEY

    openai:
      kind: openai
      endpoint: https://api.openai.com
      auth:
        type: bearer
        secret_ref: env://OPENAI_API_KEY

    gemini:
      kind: openai
      backend_schema: gcpvertexai
      endpoint: https://generativelanguage.googleapis.com
      auth:
        type: gemini
        secret_ref: env://GEMINI_API_KEY

    vertex:
      kind: openai
      backend_schema: gcpvertexai
      endpoint: https://us-central1-aiplatform.googleapis.com
      extra:
        gcp_project: env://GCP_PROJECT
        gcp_location: us-central1
      auth:
        type: gcp
        secret_ref: env://GCP_SERVICE_ACCOUNT_JSON

    vertex_anthropic:
      kind: anthropic
      backend_schema: gcpanthropic
      endpoint: https://us-east5-aiplatform.googleapis.com
      extra:
        anthropic_version: "vertex-2023-10-16"
        gcp_project: env://GCP_PROJECT
        gcp_location: us-east5
      auth:
        type: gcp
        secret_ref: env://GCP_SERVICE_ACCOUNT_JSON

    bedrock:
      kind: openai
      backend_schema: awsbedrock
      endpoint: https://bedrock-runtime.us-east-1.amazonaws.com
      extra:
        aws_region: us-east-1
      auth:
        type: aws

    # Fallback demo: RFC 5737 TEST-NET addresses — routed nowhere, time out cleanly.
    fallback_p1:
      kind: anthropic
      endpoint: https://192.0.2.1
      extra:
        anthropic_version: "2023-06-01"
      auth:
        type: bearer
        secret_ref: literal://fake
    fallback_p2:
      kind: anthropic
      endpoint: https://192.0.2.2
      extra:
        anthropic_version: "2023-06-01"
      auth:
        type: bearer
        secret_ref: literal://fake
    fallback_p3:
      kind: anthropic
      endpoint: https://192.0.2.3
      extra:
        anthropic_version: "2023-06-01"
      auth:
        type: bearer
        secret_ref: literal://fake

    # Split demo: three identical Vertex AI endpoints for weight-based traffic splitting.
    split_p1:
      kind: anthropic
      backend_schema: gcpanthropic
      endpoint: https://us-east5-aiplatform.googleapis.com
      extra:
        anthropic_version: "vertex-2023-10-16"
        gcp_project: env://GCP_PROJECT
        gcp_location: us-east5
      auth:
        type: gcp
        secret_ref: env://GCP_SERVICE_ACCOUNT_JSON
    split_p2:
      kind: anthropic
      backend_schema: gcpanthropic
      endpoint: https://us-east5-aiplatform.googleapis.com
      extra:
        anthropic_version: "vertex-2023-10-16"
        gcp_project: env://GCP_PROJECT
        gcp_location: us-east5
      auth:
        type: gcp
        secret_ref: env://GCP_SERVICE_ACCOUNT_JSON
    split_p3:
      kind: anthropic
      backend_schema: gcpanthropic
      endpoint: https://us-east5-aiplatform.googleapis.com
      extra:
        anthropic_version: "vertex-2023-10-16"
        gcp_project: env://GCP_PROJECT
        gcp_location: us-east5
      auth:
        type: gcp
        secret_ref: env://GCP_SERVICE_ACCOUNT_JSON

keys:
  # Default: direct routing to upstream providers with no overrides.
  demo/dio/sk-default: {}

  # Fallback demo: three unreachable primaries → vertex_anthropic as real fallback.
  demo/dio/sk-fallback:
    routing_overrides:
      claude-haiku-4-5:
        chain:
          retry:
            retry_on: "connect-failure,reset,5xx,retriable-status-codes"
            per_try_timeout_ms: 10000
          children:
            - target: { provider: fallback_p1, name: claude-haiku-4-5 }
            - target: { provider: fallback_p2, name: claude-haiku-4-5 }
            - target: { provider: fallback_p3, name: claude-haiku-4-5 }
            - target: { provider: vertex_anthropic, name: claude-opus-4@20250514 }

  # Split demo: 34/33/33 weight split across three Vertex AI endpoints.
  demo/dio/sk-split:
    routing_overrides:
      claude-haiku-4-5:
        split:
          children:
            - weight: 34
              target: { provider: split_p1, name: claude-haiku-4-5 }
            - weight: 33
              target: { provider: split_p2, name: claude-haiku-4-5 }
            - weight: 33
              target: { provider: split_p3, name: claude-haiku-4-5 }

profiles:
  demo/dio/default:
    path: default
    tools:
      kiwi:
        include: ["search-flight"]
      aws-knowledge:
        include: ["read_documentation", "search_documentation"]
        optional: true  # session succeeds even if aws-knowledge is unreachable
      github:
        include: ["get_me", "search_repositories", "get_file_contents"]
        optional: true  # session succeeds even if github is unreachable
    auth:
      github:
        type: bearer
        secret_ref: env://GITHUB_TOKEN
  demo/dio/kiwi-only:
    path: kiwi-only
    tools:
      kiwi: {}
  demo/dio/github:
    path: github
    tools:
      github:
        include: ["get_me", "search_repositories", "get_file_contents"]
    auth:
      github:
        type: bearer
        secret_ref: env://GITHUB_TOKEN

mcp:
  servers:
    kiwi:
      endpoint: https://mcp.kiwi.com
      namespace: kiwi
      tools_include: ["search-flight"]
    aws-knowledge:
      endpoint: https://knowledge-mcp.global.api.aws
      namespace: aws
      tools_include: ["read_documentation", "search_documentation"]
    github:
      endpoint: https://api.githubcopilot.com/mcp/
      namespace: github
      auth:
        type: bearer
        secret_ref: env://GITHUB_TOKEN # This to be used as default, but profile's secret_ref can override it.
      tools_include: ["get_me", "search_repositories", "get_file_contents"]

rate_limit:
  # Named tiers — reusable limit sets referenced from policies via rule:.
  # Inline fields in a policy entry override the tier's value for that entry.
  rules:
    workspace-standard:
      usd_per_day: 500.00
      rpm: 300
      on_exceed: reject

    user-standard:
      usd_per_day: 100.00
      rpm: 60
      on_exceed: reject

    key-basic:
      usd_per_hour: 10.00
      usd_per_day: 50.00
      rpm: 20
      on_exceed: reject

    key-token-knobs:
      input_tokens_per_hour: 1_000_000
      output_tokens_per_hour: 250_000
      cache_read_tokens_per_hour: 2_000_000
      cache_write_tokens_per_hour: 200_000
      on_exceed: reject

  policies:
    # Workspace ceiling: every key under "demo" is subject to these limits.
    # Changing this entry alone adjusts the cap for the entire workspace.
    demo:
      - rule: workspace-standard
        models: [claude-haiku-4-5, claude-haiku-4-5-20251001]
      - models: ["*"]
        rpm: 400
        on_exceed: reject

    # User ceiling: dio's total spend across all keys is bounded here.
    # Both the workspace rule above and this rule apply simultaneously.
    demo/dio:
      - rule: user-standard
        models: [claude-haiku-4-5, claude-haiku-4-5-20251001]
      - models: ["*"]
        rpm: 80
        on_exceed: reject

    # Key-level policies: stacked on top of workspace and user rules.
    demo/dio/sk-default:
      - rule: key-basic
        models: [claude-haiku-4-5, claude-haiku-4-5-20251001]
      - rule: key-token-knobs
        models: [claude-haiku-4-5, claude-haiku-4-5-20251001]
      - models: ["*"]
        rpm: 10
        on_exceed: log_only

    demo/dio/sk-fallback:
      - rule: key-basic
        models: [claude-haiku-4-5]
        usd_per_hour: 20.00  # override tier: higher budget for fallback key

    demo/dio/sk-split:
      - rule: key-basic
        models: [claude-haiku-4-5, claude-haiku-4-5-20251001]
        rpm: 30  # override tier: slightly more headroom for split key
