// admin.proto — ConfigAdminService: management-plane operations for orange config.
//
// This service is used by the admin panel and CI pipelines to publish new config
// snapshots, manage API keys and user profiles, and configure rate limits.
//
// Authentication: every RPC requires AUTH_TYPE_API_KEY with scope "admin".
// The gateway enforces this at the transport layer before any handler runs.
//
// workspace_id is a first-class indexed field on every request — it is never
// baked into key or profile identifiers. Key IDs follow the 2-segment convention:
// user/name. Profile IDs follow the same: user/name. Rate-limit scopes are
// expressed as workspace_id + optional user (absent = workspace-level scope).
//
// Field numbers are stable and must not be reused once released.

syntax = "proto3";

package orange.config.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "orange/auth/v1/auth_options.proto";
import "orange/routing/v1/routing.proto";


// ── Service ───────────────────────────────────────────────────────────────────

service ConfigAdminService {
  // ── Snapshot management ───────────────────────────────────────────────────

  // PublishSnapshot stores a new compiled config snapshot and broadcasts it to
  // connected data-plane proxies via the SnapshotService Watch stream.
  rpc PublishSnapshot(PublishSnapshotRequest) returns (PublishSnapshotResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // ListSnapshots returns snapshot metadata in descending version order.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetSnapshot returns the full envelope for a specific version.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RollbackSnapshot marks a prior version as the active serving version by
  // re-publishing its payload as a new snapshot with an incremented version number.
  rpc RollbackSnapshot(RollbackSnapshotRequest) returns (RollbackSnapshotResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // ── Key management ────────────────────────────────────────────────────────

  // CreateKey provisions a new API key record. The key is included in the next
  // published snapshot; it does not take effect until PublishSnapshot is called.
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // ListKeys returns all key records for a workspace, optionally filtered by user.
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetKey returns the key record for a given key ID within a workspace.
  rpc GetKey(GetKeyRequest) returns (GetKeyResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // UpdateKey replaces the mutable fields of an existing key record.
  rpc UpdateKey(UpdateKeyRequest) returns (UpdateKeyResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // DeleteKey removes a key record. Takes effect on the next PublishSnapshot.
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // ── Profile management ────────────────────────────────────────────────────

  // CreateProfile provisions a new user profile. Takes effect on next publish.
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // ListProfiles returns all profile records for a workspace, optionally filtered by user.
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetProfile returns the profile record for a given profile ID within a workspace.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // UpdateProfile replaces the mutable fields of an existing profile.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // DeleteProfile removes a profile record. Takes effect on next publish.
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // ── Rate-limit tier management ────────────────────────────────────────────
  //
  // Tiers are named limit primitives reusable across policy entries. They are
  // workspace-scoped. The snapshot compiler expands tier references into flat
  // RateLimitRule entries before encoding; tiers are never on the wire.

  // CreateRateLimitTier creates a new named tier within a workspace.
  rpc CreateRateLimitTier(CreateRateLimitTierRequest) returns (CreateRateLimitTierResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // GetRateLimitTier returns a named tier by workspace and name.
  // Accessible to any caller with rl-policy:write[ctx] so they can discover
  // available tiers when authoring policy entries.
  rpc GetRateLimitTier(GetRateLimitTierRequest) returns (GetRateLimitTierResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["rl-policy:write"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // UpdateRateLimitTier replaces all limit fields on an existing tier.
  rpc UpdateRateLimitTier(UpdateRateLimitTierRequest) returns (UpdateRateLimitTierResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // DeleteRateLimitTier removes a named tier. Returns NOT_FOUND if the tier is
  // still referenced by an active policy entry.
  rpc DeleteRateLimitTier(DeleteRateLimitTierRequest) returns (DeleteRateLimitTierResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // ListRateLimitTiers returns all active tiers for a workspace.
  // Accessible to any caller with rl-policy:write[ctx] so they can discover
  // available tiers when authoring policy entries.
  rpc ListRateLimitTiers(ListRateLimitTiersRequest) returns (ListRateLimitTiersResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["rl-policy:write"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ── Rate-limit scope management ───────────────────────────────────────────
  //
  // All scope RPCs require rl-policy:write. The interceptor validates the base
  // scope; the handler enforces the context: a key carrying
  // "rl-policy:write[ws/user]" may only manage that exact scope, while
  // "rl-policy:write[ws]" covers the workspace scope and all user scopes under
  // it. Admin keys pass without context restriction.

  // SetRateLimitScope creates or replaces the policy entries for a workspace
  // or user scope within a workspace. Takes effect on next publish.
  rpc SetRateLimitScope(SetRateLimitScopeRequest) returns (SetRateLimitScopeResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["rl-policy:write"]
    };
  }

  // GetRateLimitScope returns the current policy entries for a scope.
  rpc GetRateLimitScope(GetRateLimitScopeRequest) returns (GetRateLimitScopeResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["rl-policy:write"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListRateLimitScopes returns rate-limit scopes for a workspace. Non-admin
  // callers see only the scopes their rl-policy:write[ctx] tokens authorize.
  rpc ListRateLimitScopes(ListRateLimitScopesRequest) returns (ListRateLimitScopesResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["rl-policy:write"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // DeleteRateLimitScope removes all policy entries for a scope.
  rpc DeleteRateLimitScope(DeleteRateLimitScopeRequest) returns (DeleteRateLimitScopeResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["rl-policy:write"]
    };
  }
}

// ── Snapshot messages ─────────────────────────────────────────────────────────

message PublishSnapshotRequest {
  // workspace_id is the UUID7 workspace this snapshot belongs to.
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // yaml_config is a valid orange config YAML document. The server compiles it,
  // stores the result, and broadcasts it to connected data-plane proxies.
  string yaml_config = 2 [(buf.validate.field).string.min_len = 1];

  // published_by identifies the operator or CI pipeline publishing this version.
  string published_by = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message PublishSnapshotResponse {
  SnapshotMeta snapshot = 1;
}

message ListSnapshotsRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // limit caps the number of results returned (default 50, max 500).
  optional int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];

  // page_token is the opaque pagination cursor from the previous response.
  optional string page_token = 3;
}

message ListSnapshotsResponse {
  repeated SnapshotMeta snapshots = 1;
  string next_page_token = 2;
}

message GetSnapshotRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  uint64 version = 2 [(buf.validate.field).uint64.gte = 1];
}

message GetSnapshotResponse {
  SnapshotMeta snapshot = 1;
  // yaml_payload is the original YAML submitted at publish time.
  optional string yaml_payload = 2;
}

message RollbackSnapshotRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // target_version is the snapshot version to roll back to.
  uint64 target_version = 2 [(buf.validate.field).uint64.gte = 1];

  // rolled_back_by identifies the operator performing the rollback.
  string rolled_back_by = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message RollbackSnapshotResponse {
  // new_version is the version number assigned to the re-published snapshot.
  uint64 new_version = 1;

  SnapshotMeta snapshot = 2;
}

// SnapshotMeta is a lightweight descriptor for a stored snapshot (no payload).
message SnapshotMeta {
  string workspace_id = 1;
  uint64 version = 2;
  string format = 3;       // "yaml", "proto", "json", "msgpack"
  string compression = 4;  // "none", "zstd"
  int32 byte_size = 5;
  bytes checksum = 6;      // SHA-256 of the decompressed payload; nil if absent
  bool compiled_ok = 7;
  optional string compile_error = 8;
  string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
}

// ── Key messages ──────────────────────────────────────────────────────────────

message CreateKeyRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // key_id is the 2-segment identifier within the workspace: user/name.
  string key_id = 2 [(buf.validate.field).string = {
    pattern: "^[^/]+/[^/]+$"
    min_len: 3
    max_len: 255
  }];

  repeated orange.routing.v1.RoutingOverride routing_overrides = 3;
  repeated RateLimitRule rate_limit_rules = 4;
}

message CreateKeyResponse {
  KeyRecord key = 1;
}

message ListKeysRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // user narrows results to user/... keys within the workspace.
  optional string user = 2 [(buf.validate.field).string.max_len = 255];

  optional int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  optional string page_token = 4;
}

message ListKeysResponse {
  repeated KeyRecord keys = 1;
  string next_page_token = 2;
}

message GetKeyRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // key_id is the 2-segment identifier: user/name.
  string key_id = 2 [(buf.validate.field).string = {
    pattern: "^[^/]+/[^/]+$"
    min_len: 3
    max_len: 255
  }];
}

message GetKeyResponse {
  KeyRecord key = 1;
}

message UpdateKeyRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // key_id is the 2-segment identifier: user/name.
  string key_id = 2 [(buf.validate.field).string = {
    pattern: "^[^/]+/[^/]+$"
    min_len: 3
    max_len: 255
  }];

  repeated orange.routing.v1.RoutingOverride routing_overrides = 3;
  repeated RateLimitRule rate_limit_rules = 4;
}

message UpdateKeyResponse {
  KeyRecord key = 1;
}

message DeleteKeyRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // key_id is the 2-segment identifier: user/name.
  string key_id = 2 [(buf.validate.field).string = {
    pattern: "^[^/]+/[^/]+$"
    min_len: 3
    max_len: 255
  }];
}

message DeleteKeyResponse {}

// KeyRecord is the admin-plane representation of a key.
message KeyRecord {
  string workspace_id = 1;
  string key_id = 2; // user/name within the workspace
  repeated orange.routing.v1.RoutingOverride routing_overrides = 3;
  repeated RateLimitRule rate_limit_rules = 4;
}

// ── Profile messages ──────────────────────────────────────────────────────────

message CreateProfileRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // profile_id is the 2-segment identifier within the workspace: user/name.
  string profile_id = 2 [(buf.validate.field).string = {
    pattern: "^[^/]+/[^/]+$"
    min_len: 3
    max_len: 255
  }];

  repeated ToolFilter tools = 3;
  repeated AuthOverride auth_overrides = 4;
}

message CreateProfileResponse {
  ProfileRecord profile = 1;
}

message ListProfilesRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  optional string user = 2 [(buf.validate.field).string.max_len = 255];

  optional int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  optional string page_token = 4;
}

message ListProfilesResponse {
  repeated ProfileRecord profiles = 1;
  string next_page_token = 2;
}

message GetProfileRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // profile_id is the 2-segment identifier: user/name.
  string profile_id = 2 [(buf.validate.field).string = {
    pattern: "^[^/]+/[^/]+$"
    min_len: 3
    max_len: 255
  }];
}

message GetProfileResponse {
  ProfileRecord profile = 1;
}

message UpdateProfileRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // profile_id is the 2-segment identifier: user/name.
  string profile_id = 2 [(buf.validate.field).string = {
    pattern: "^[^/]+/[^/]+$"
    min_len: 3
    max_len: 255
  }];

  repeated ToolFilter tools = 3;
  repeated AuthOverride auth_overrides = 4;
}

message UpdateProfileResponse {
  ProfileRecord profile = 1;
}

message DeleteProfileRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // profile_id is the 2-segment identifier: user/name.
  string profile_id = 2 [(buf.validate.field).string = {
    pattern: "^[^/]+/[^/]+$"
    min_len: 3
    max_len: 255
  }];
}

message DeleteProfileResponse {}

// ProfileRecord is the admin-plane representation of a user profile.
message ProfileRecord {
  string workspace_id = 1;
  string profile_id = 2; // user/name within the workspace
  repeated ToolFilter tools = 3;
  repeated AuthOverride auth_overrides = 4;
}

// ToolFilter controls which MCP tools a profile may access from a server.
message ToolFilter {
  string server = 1;           // MCP server name (matches mcp.servers map key)
  repeated string include = 2; // empty = all tools the server allows
  bool optional = 3;           // if true, missing server does not block the profile
}

// AuthOverride substitutes a per-profile credential for a specific MCP server.
message AuthOverride {
  string server = 1;     // MCP server name
  string auth_type = 2;  // "bearer", "anthropic", "gcp", "aws", "gemini"
  string secret_ref = 3; // secret reference (env://, file://, literal://, …)
}

// ── Rate-limit messages ───────────────────────────────────────────────────────

// ── Tier CRUD ─────────────────────────────────────────────────────────────────

message CreateRateLimitTierRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z0-9_-]+$"
  }];

  double usd_per_minute = 3;
  double usd_per_hour   = 4;
  double usd_per_day    = 5;

  int32 rpm = 6;
  int32 rph = 7;
  int32 rpd = 8;

  int32 input_tokens_per_minute  = 9;
  int32 input_tokens_per_hour    = 10;
  int32 input_tokens_per_day     = 11;

  int32 output_tokens_per_minute = 12;
  int32 output_tokens_per_hour   = 13;
  int32 output_tokens_per_day    = 14;

  int32 cache_read_tokens_per_hour  = 15;
  int32 cache_read_tokens_per_day   = 16;

  int32 cache_write_tokens_per_hour = 17;
  int32 cache_write_tokens_per_day  = 18;

  OnExceed on_exceed = 19;
}

message CreateRateLimitTierResponse {
  RateLimitTier tier = 1;
}

message GetRateLimitTierRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message GetRateLimitTierResponse {
  RateLimitTier tier = 1;
}

message UpdateRateLimitTierRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];

  // All limit fields are replaced in full — unset fields reset to unconstrained.
  double usd_per_minute = 3;
  double usd_per_hour   = 4;
  double usd_per_day    = 5;

  int32 rpm = 6;
  int32 rph = 7;
  int32 rpd = 8;

  int32 input_tokens_per_minute  = 9;
  int32 input_tokens_per_hour    = 10;
  int32 input_tokens_per_day     = 11;

  int32 output_tokens_per_minute = 12;
  int32 output_tokens_per_hour   = 13;
  int32 output_tokens_per_day    = 14;

  int32 cache_read_tokens_per_hour  = 15;
  int32 cache_read_tokens_per_day   = 16;

  int32 cache_write_tokens_per_hour = 17;
  int32 cache_write_tokens_per_day  = 18;

  OnExceed on_exceed = 19;
}

message UpdateRateLimitTierResponse {
  RateLimitTier tier = 1;
}

message DeleteRateLimitTierRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // name of the tier to delete. Returns NOT_FOUND if the tier is still
  // referenced by an active policy entry.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message DeleteRateLimitTierResponse {}

message ListRateLimitTiersRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  optional int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  optional string page_token = 3;
}

message ListRateLimitTiersResponse {
  repeated RateLimitTier tiers = 1;
  string next_page_token = 2;
}

// ── Scope CRUD ────────────────────────────────────────────────────────────────

message SetRateLimitScopeRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // user scopes entries to a specific user within the workspace.
  // Absent means the entries apply at the workspace level.
  optional string user = 2 [(buf.validate.field).string.max_len = 255];

  // entries replaces the full ordered list of policy entries for this scope.
  repeated RateLimitPolicyEntry entries = 3;
}

message SetRateLimitScopeResponse {
  RateLimitScope scope = 1;
}

message GetRateLimitScopeRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // user identifies a user-level scope. Absent = workspace-level scope.
  optional string user = 2 [(buf.validate.field).string.max_len = 255];
}

message GetRateLimitScopeResponse {
  RateLimitScope scope = 1;
}

message ListRateLimitScopesRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  optional int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  optional string page_token = 3;
}

message ListRateLimitScopesResponse {
  repeated RateLimitScope scopes = 1;
  string next_page_token = 2;
}

message DeleteRateLimitScopeRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];

  // user identifies a user-level scope. Absent = workspace-level scope.
  optional string user = 2 [(buf.validate.field).string.max_len = 255];
}

message DeleteRateLimitScopeResponse {}

// RateLimitScope groups policy entries under a workspace or user scope.
message RateLimitScope {
  string workspace_id = 1;
  // user is absent for workspace-level scopes.
  optional string user = 2;
  repeated RateLimitPolicyEntry entries = 3;
}

// RateLimitTier is a named set of rate-limit limits reusable across policy
// entries. Tiers are workspace-scoped. Zero values mean unconstrained.
// The snapshot compiler expands tier references before encoding; the wire
// format (snapshot.proto) carries only flat RateLimitRule entries.
message RateLimitTier {
  // name is unique within the workspace, e.g. "standard", "premium".
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-z0-9_-]+$"
  }];

  double usd_per_minute = 2;
  double usd_per_hour   = 3;
  double usd_per_day    = 4;

  int32 rpm = 5;
  int32 rph = 6;
  int32 rpd = 7;

  int32 input_tokens_per_minute  = 8;
  int32 input_tokens_per_hour    = 9;
  int32 input_tokens_per_day     = 10;

  int32 output_tokens_per_minute = 11;
  int32 output_tokens_per_hour   = 12;
  int32 output_tokens_per_day    = 13;

  int32 cache_read_tokens_per_hour  = 14;
  int32 cache_read_tokens_per_day   = 15;

  int32 cache_write_tokens_per_hour = 16;
  int32 cache_write_tokens_per_day  = 17;

  OnExceed on_exceed = 18;

  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}

// RateLimitPolicyEntry is one entry in a scope's ordered policy list.
// tier_name references a named RateLimitTier; non-zero inline limit fields
// override the tier for that dimension. Either tier_name or at least one
// inline limit field must be set.
message RateLimitPolicyEntry {
  // models lists model IDs this entry applies to. Use ["*"] for all models.
  repeated string models = 1 [(buf.validate.field).repeated.min_items = 1];

  // tier_name references a named tier within the same workspace. Non-zero
  // inline fields below override the corresponding tier field.
  optional string tier_name = 2 [(buf.validate.field).string.max_len = 64];

  double usd_per_minute = 3;
  double usd_per_hour   = 4;
  double usd_per_day    = 5;

  int32 rpm = 6;
  int32 rph = 7;
  int32 rpd = 8;

  int32 input_tokens_per_minute  = 9;
  int32 input_tokens_per_hour    = 10;
  int32 input_tokens_per_day     = 11;

  int32 output_tokens_per_minute = 12;
  int32 output_tokens_per_hour   = 13;
  int32 output_tokens_per_day    = 14;

  int32 cache_read_tokens_per_hour  = 15;
  int32 cache_read_tokens_per_day   = 16;

  int32 cache_write_tokens_per_hour = 17;
  int32 cache_write_tokens_per_day  = 18;

  OnExceed on_exceed = 19;
}

// RateLimitRule is used for key-scope rules only (user-managed, no tier
// reference). Zero values mean "unconstrained" for that dimension.
// on_exceed defaults to REJECT.
message RateLimitRule {
  // models lists model IDs this rule applies to. Use ["*"] for all models.
  repeated string models = 1;

  double usd_per_minute = 2;
  double usd_per_hour = 3;
  double usd_per_day = 4;

  int32 rpm = 5;  // requests per minute
  int32 rph = 6;  // requests per hour
  int32 rpd = 7;  // requests per day

  int32 input_tokens_per_minute = 8;
  int32 input_tokens_per_hour = 9;
  int32 input_tokens_per_day = 10;

  int32 output_tokens_per_minute = 11;
  int32 output_tokens_per_hour = 12;
  int32 output_tokens_per_day = 13;

  int32 cache_read_tokens_per_hour = 14;
  int32 cache_read_tokens_per_day = 15;

  int32 cache_write_tokens_per_hour = 16;
  int32 cache_write_tokens_per_day = 17;

  OnExceed on_exceed = 18;
}

// OnExceed controls the action when a rate limit is exhausted.
enum OnExceed {
  ON_EXCEED_UNSPECIFIED = 0; // treated as ON_EXCEED_REJECT
  ON_EXCEED_REJECT = 1;
  ON_EXCEED_THROTTLE = 2;
  ON_EXCEED_LOG_ONLY = 3;
}
