// snapshot.proto — orange config snapshot wire format.
//
// The envelope carries a compressed ConfigPayload. All repeated string fields
// inside sub-messages are indices into a top-level StringTable rather than
// inline strings. The receiver expands indices back to strings in protoToRaw()
// before handing a RawConfig to compile(); compile() never sees proto types.
//
// Field numbers are stable and must not be reused once released.

syntax = "proto3";

package orange.config.v1;


// ── Envelope ──────────────────────────────────────────────────────────────────

// SnapshotEnvelope is the outermost frame delivered over gRPC or HTTP.
// Payload contains a compressed (or raw) ConfigPayload proto.
message SnapshotEnvelope {
  uint64 version = 1; // monotonically increasing; receiver discards if <= last accepted
  PayloadFormat format = 2;
  Compression compression = 3;
  bytes payload = 4; // compressed ConfigPayload proto bytes
  bytes checksum = 5; // SHA-256 of the decompressed payload bytes
}

enum PayloadFormat {
  PAYLOAD_FORMAT_UNSPECIFIED = 0;
  PAYLOAD_FORMAT_PROTO = 1;
  PAYLOAD_FORMAT_YAML = 2; // local/dev only
  PAYLOAD_FORMAT_JSON = 3; // local/dev only
  PAYLOAD_FORMAT_MSGPACK = 4; // optional; same logical shape as proto
}

enum Compression {
  COMPRESSION_UNSPECIFIED = 0; // treated as COMPRESSION_NONE by protoToRaw()
  COMPRESSION_NONE = 1;
  COMPRESSION_ZSTD = 2;
}

// ── Payload ───────────────────────────────────────────────────────────────────

// ConfigPayload is the decompressed content of SnapshotEnvelope.payload.
// All repeated string fields in sub-messages are indices into strings.
// Records are sorted by their primary index before encoding to produce
// deterministic byte output for a given logical config.
message ConfigPayload {
  StringTable strings = 1;
  repeated Provider providers = 2; // sorted by name_idx
  repeated Model models = 3; // sorted by name_idx
  repeated Server servers = 4; // sorted by name_idx
  repeated Profile profiles = 5; // sorted by id_idx
  repeated Key keys = 6; // sorted by id_idx
  repeated RateLimitScope rate_limits = 7; // sorted by scope_idx; workspace/user scopes only
}

// StringTable deduplicates all repeated strings across the payload.
// Index 0 is reserved (empty / unset). The first real string is at index 1.
message StringTable {
  repeated string strings = 1;
}

// ── Admin-owned: providers ────────────────────────────────────────────────────

message Provider {
  uint32 name_idx = 1; // llm.providers map key
  ProviderKind kind = 2;
  uint32 backend_schema_idx = 3; // optional; 0 = unset (use kind as schema name)
  uint32 endpoint_idx = 4;
  Auth auth = 5;
  repeated KV extra = 6; // forwarded headers / provider-specific params
}

enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_ANTHROPIC = 1;
  PROVIDER_KIND_OPENAI = 2;
  PROVIDER_KIND_BEDROCK = 3;
}

// ── Admin-owned: models ───────────────────────────────────────────────────────

message Model {
  uint32 name_idx = 1; // client-facing model ID
  uint32 provider_idx = 2; // matches a Provider.name_idx
  uint32 api_name_idx = 3; // backend model name; 0 = use name_idx
  repeated EndpointOverride endpoint_overrides = 4;
  ModelPricing pricing = 5; // zero value = absent (no pricing)
  ModelMetadata metadata = 6; // zero value = absent
}

message EndpointOverride {
  uint32 operation_idx = 1; // e.g. index of "chat_completions"
  uint32 provider_idx = 2; // override provider for this operation only
}

// ModelPricing holds per-model token prices in USD per million tokens.
// double is used on the wire; protoToRaw() converts to decimal.Decimal via
// decimal.NewFromFloat() before handing off to compile().
message ModelPricing {
  double input_mtok = 1;
  double output_mtok = 2;
  double cache_read_mtok = 3;
  double cache_write_mtok = 4;
}

message ModelMetadata {
  uint32 description_idx = 1;
  int32 context_length = 2;
  int32 max_tokens = 3;
  repeated uint32 tag_idxs = 4;
}

// ── Admin-owned: MCP servers ──────────────────────────────────────────────────

message Server {
  uint32 name_idx = 1; // mcp.servers map key
  uint32 endpoint_idx = 2;
  uint32 namespace_idx = 3;
  Auth auth = 4; // zero AuthType = absent
  repeated uint32 tools_include_idxs = 5; // empty = all tools allowed
}

// ── Auth — shared by Provider, Server, Profile ────────────────────────────────

// Auth carries an auth type enum and a string-table index for the secret
// reference. The reference (e.g. env://MY_VAR) is expanded by protoToRaw()
// and then resolved lazily at request time by the SecretResolver.
message Auth {
  AuthType type = 1;
  uint32 secret_idx = 2; // index of the secret ref string (env://, file://, literal://, …)
}

enum AuthType {
  AUTH_TYPE_UNSPECIFIED = 0;
  AUTH_TYPE_BEARER = 1;
  AUTH_TYPE_ANTHROPIC = 2;
  AUTH_TYPE_GCP = 3;
  AUTH_TYPE_AWS = 4;
  AUTH_TYPE_GEMINI = 5;
}

// ── User-owned: profiles ──────────────────────────────────────────────────────

message Profile {
  uint32 id_idx = 1; // workspace/user/name identity
  repeated ToolFilter tools = 2;
  repeated AuthOverride auth_overrides = 3;
}

message ToolFilter {
  uint32 server_idx = 1;
  repeated uint32 include_idxs = 2; // empty = expose all tools the server allows
  bool optional = 3;
}

message AuthOverride {
  uint32 server_idx = 1;
  Auth auth = 2;
}

// ── User-owned: keys ──────────────────────────────────────────────────────────

message Key {
  uint32 id_idx = 1; // workspace/user/name identity
  repeated RoutingOverride routing_overrides = 2;
  repeated RateLimitRule rate_limit_rules = 3; // key-scope; set by the key owner
}

message RoutingOverride {
  uint32 model_idx = 1; // string-table index of the client-facing model ID
  RoutingNode node = 2;
}

// RoutingNode is a recursive tree node. Exactly one of target, chain, or split
// must be set. Nesting rules enforced by compile():
//   - chain children: target or split only (no chain-of-chain)
//   - split children: target or chain only (no split-of-split)
message RoutingNode {
  oneof kind {
    RoutingTarget target = 1;
    ChainConfig chain = 2;
    SplitConfig split = 3;
  }
}

message RoutingTarget {
  uint32 provider_idx = 1;
  uint32 name_idx = 2; // backend model name; 0 = use client-facing model ID
}

message ChainConfig {
  RetryPolicy retry = 1; // optional
  repeated RoutingNode children = 2;
}

message RetryPolicy {
  uint32 retry_on_idx = 1; // e.g. index of "connect-failure,reset,5xx"
  int32 per_try_timeout_ms = 2;
}

message SplitConfig {
  repeated SplitChild children = 1; // weights must sum to 100
}

message SplitChild {
  int32 weight = 1;
  RoutingNode node = 2;
}

// ── Admin-owned: rate limits (workspace and user scopes only) ─────────────────
// Key-scope (3-segment) rules are encoded in Key.rate_limit_rules, not here.

message RateLimitScope {
  uint32 scope_idx = 1; // 1- or 2-segment scope (workspace or workspace/user)
  repeated RateLimitRule rules = 2;
}

// RateLimitRule mirrors RawRateLimitRule. USD fields use double on the wire;
// protoToRaw() converts them to decimal.Decimal via decimal.NewFromFloat().
// Zero values are unconstrained for that dimension.
// on_exceed defaults to ON_EXCEED_UNSPECIFIED which is treated as reject.
message RateLimitRule {
  repeated uint32 model_idxs = 1; // ["*"] encoded as the index of the literal "*" string

  double usd_per_minute = 2;
  double usd_per_hour = 3;
  double usd_per_day = 4;

  int32 rpm = 5;
  int32 rph = 6;
  int32 rpd = 7;

  int32 input_tokens_per_minute = 8;
  int32 input_tokens_per_hour = 9;
  int32 input_tokens_per_day = 10;

  int32 output_tokens_per_minute = 11;
  int32 output_tokens_per_hour = 12;
  int32 output_tokens_per_day = 13;

  int32 cache_read_tokens_per_hour = 14;
  int32 cache_read_tokens_per_day = 15;

  int32 cache_write_tokens_per_hour = 16;
  int32 cache_write_tokens_per_day = 17;

  OnExceed on_exceed = 18;
}

// OnExceed controls the action taken when a rate limit is exhausted.
// UNSPECIFIED is treated as REJECT by protoToRaw().
enum OnExceed {
  ON_EXCEED_UNSPECIFIED = 0; // treated as ON_EXCEED_REJECT
  ON_EXCEED_REJECT = 1;
  ON_EXCEED_THROTTLE = 2;
  ON_EXCEED_LOG_ONLY = 3;
}

// ── Shared primitives ─────────────────────────────────────────────────────────

// KV is a key-value pair of string-table indices, used for provider extra fields.
message KV {
  uint32 key_idx = 1;
  uint32 value_idx = 2;
}
