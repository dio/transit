// routing.proto — shared routing composition types.
//
// RoutingOverride maps a client-facing model ID to a routing tree.
// A routing tree is a recursive structure of target, chain, or split nodes:
//   target — single hop to a named provider + optional backend model
//   chain  — ordered fallback; tries children in order, stops at first success
//   split  — weighted traffic distribution; one child chosen per request
//
// Nesting rules:
//   chain children may be target or split
//   split children may be target or chain
//   nested split-inside-split is not supported
//
// These types are imported by config/admin/v1 (snapshot-level overrides)
// and key/admin/v1 (per-key routing overrides stored on the Key entity).
//
// Field numbers are stable and must not be reused once released.

syntax = "proto3";

package orange.routing.v1;

// RoutingOverride maps a client-facing model ID to a routing tree.
message RoutingOverride {
  string model_id = 1; // client-facing model ID (e.g. "claude-haiku-4-5")
  RoutingNode node = 2;
}

// RoutingNode is a recursive routing tree. Exactly one of target, chain, or
// split must be set.
message RoutingNode {
  oneof kind {
    RoutingTarget target = 1;
    ChainConfig   chain  = 2;
    SplitConfig   split  = 3;
  }
}

// RoutingTarget is a leaf node naming a provider and optional backend model.
message RoutingTarget {
  string provider = 1; // provider name (matches llm.providers map key)
  string model    = 2; // backend model name; empty = use client-facing model ID
}

// ChainConfig tries children in order; stops at the first success.
message ChainConfig {
  RetryPolicy        retry    = 1;
  repeated RoutingNode children = 2;
}

// RetryPolicy maps to Envoy's retry semantics.
message RetryPolicy {
  string retry_on          = 1; // e.g. "connect-failure,reset,5xx"
  int32  per_try_timeout_ms = 2;
}

// SplitConfig samples one child per request by weight (weights must sum to 100).
message SplitConfig {
  repeated SplitChild children = 1;
}

message SplitChild {
  int32       weight = 1;
  RoutingNode node   = 2;
}
