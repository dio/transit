// admin.proto — ProjectAdminService: lifecycle management for orange projects.
//
// A Project is owned by an Organization and groups Workspaces under a common
// administrative scope. Project-level policies set organizational guardrails
// that Workspace and Key policies may only narrow, never widen.
//
// project_id is server-assigned as a UUID7 on CreateProject.
//
// Authentication: every RPC requires AUTH_TYPE_API_KEY with scope "admin".
//
// Field numbers are stable and must not be reused once released.

syntax = "proto3";

package orange.project.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "orange/auth/v1/auth_options.proto";

service ProjectAdminService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
}

message CreateProjectRequest {
  string org_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  string name = 2 [(buf.validate.field).string = {
    pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
    min_len: 2
    max_len: 63
  }];
  optional string description = 3 [(buf.validate.field).string.max_len = 1024];
}

message CreateProjectResponse { Project project = 1; }

message GetProjectRequest {
  string project_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetProjectResponse { Project project = 1; }

message ListProjectsRequest {
  string org_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional int32 limit = 2 [(buf.validate.field).int32 = {gte: 0 lte: 1000}];
  optional string page_token = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  string next_page_token = 2;
}

message UpdateProjectRequest {
  string project_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional string description = 2 [(buf.validate.field).string.max_len = 1024];
}

message UpdateProjectResponse { Project project = 1; }

message DeleteProjectRequest {
  string project_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message DeleteProjectResponse {}

// Project groups Workspaces under a common administrative scope within an Org.
message Project {
  string project_id = 1;   // UUID7, server-assigned
  string org_id = 2;       // owning organization
  string name = 3;         // unique within org
  optional string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}
