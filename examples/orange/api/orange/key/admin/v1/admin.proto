// admin.proto — KeyAdminService: Key, PASETOToken, and KeySecret management.
//
// A Key is permanently bound to a single Workspace and a single User.
// key_format is always "paseto_v4.public" (Ed25519).
// key_id is server-assigned as a UUID7.
//
// PASETOToken records metadata and hash of an issued PASETO v4 token;
// the token itself is never stored.
//
// KeySecret (BYOK) is a user-supplied versioned upstream credential bound
// to a specific Key. It overrides the Workspace Secret during request dispatch.
//
// Authentication: every RPC requires AUTH_TYPE_API_KEY with scope "admin".
//
// Field numbers are stable and must not be reused once released.

syntax = "proto3";

package orange.key.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "orange/auth/v1/auth_options.proto";
import "orange/routing/v1/routing.proto";

service KeyAdminService {
  // ── Key CRUD ──────────────────────────────────────────────────────────────

  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  rpc GetKey(GetKeyRequest) returns (GetKeyResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateKey(UpdateKeyRequest) returns (UpdateKeyResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }

  // ── PASETO token management ───────────────────────────────────────────────

  // IssueToken issues a new PASETO v4 token and stores its metadata.
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  // GetToken returns metadata for a previously issued token.
  rpc GetToken(GetTokenRequest) returns (GetTokenResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListTokens lists token metadata records for a key.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeToken marks a token as revoked. The token itself is never stored.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }

  // ── KeySecret (BYOK) management ───────────────────────────────────────────

  // CreateKeySecret creates a versioned upstream credential bound to a key.
  rpc CreateKeySecret(CreateKeySecretRequest) returns (CreateKeySecretResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  // GetKeySecret returns a KeySecret record (value is never returned).
  rpc GetKeySecret(GetKeySecretRequest) returns (GetKeySecretResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListKeySecrets lists all KeySecrets for a key.
  rpc ListKeySecrets(ListKeySecretsRequest) returns (ListKeySecretsResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RotateKeySecret creates a new version of a KeySecret.
  rpc RotateKeySecret(RotateKeySecretRequest) returns (RotateKeySecretResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  // DeleteKeySecret permanently removes a KeySecret and all its versions.
  rpc DeleteKeySecret(DeleteKeySecretRequest) returns (DeleteKeySecretResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
}

// ── Key messages ──────────────────────────────────────────────────────────────

message CreateKeyRequest {
  string workspace_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  string user_id = 2 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  string name = 3 [(buf.validate.field).string = {
    pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
    min_len: 2
    max_len: 63
  }];
  optional string description = 4 [(buf.validate.field).string.max_len = 1024];
  repeated orange.routing.v1.RoutingOverride routing_overrides = 5;
}

message CreateKeyResponse { Key key = 1; }

message GetKeyRequest {
  string key_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetKeyResponse { Key key = 1; }

message ListKeysRequest {
  string workspace_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional string user_id = 2 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional int32 limit = 3 [(buf.validate.field).int32 = {gte: 0 lte: 1000}];
  optional string page_token = 4;
}

message ListKeysResponse {
  repeated Key keys = 1;
  string next_page_token = 2;
}

message UpdateKeyRequest {
  string key_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional string description = 2 [(buf.validate.field).string.max_len = 1024];
  repeated orange.routing.v1.RoutingOverride routing_overrides = 3;
}

message UpdateKeyResponse { Key key = 1; }

message DeleteKeyRequest {
  string key_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message DeleteKeyResponse {}

// Key is permanently bound to a Workspace and User. key_format is always "paseto_v4.public".
message Key {
  string key_id = 1;          // UUID7, server-assigned
  string workspace_id = 2;    // owning workspace; immutable
  string user_id = 3;         // owning user; immutable
  string name = 4;            // unique within workspace+user
  string key_format = 5;      // always "paseto_v4.public"
  optional string description = 6;
  // routing_overrides maps client-facing model IDs to routing trees.
  // Empty means use default routing from GlobalConfig.Models.
  repeated orange.routing.v1.RoutingOverride routing_overrides = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// ── PASETOToken messages ──────────────────────────────────────────────────────

message IssueTokenRequest {
  string key_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  // exp is the token expiry in seconds from now.
  int64 ttl_seconds = 2 [(buf.validate.field).int64 = {gte: 1 lte: 86400}];
  // pol is an optional embedded policy JSON attached to the token.
  optional string pol = 3 [(buf.validate.field).string.max_len = 4096];
}

message IssueTokenResponse {
  // token is the signed PASETO v4 token — only returned once; not stored.
  string token = 1;
  PASETOToken metadata = 2;
}

message GetTokenRequest {
  string token_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetTokenResponse { PASETOToken token = 1; }

message ListTokensRequest {
  string key_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional bool include_revoked = 2;
  optional int32 limit = 3 [(buf.validate.field).int32 = {gte: 0 lte: 1000}];
  optional string page_token = 4;
}

message ListTokensResponse {
  repeated PASETOToken tokens = 1;
  string next_page_token = 2;
}

message RevokeTokenRequest {
  string token_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message RevokeTokenResponse {}

// PASETOToken stores token metadata only; the bearer token itself is never stored.
message PASETOToken {
  string token_id = 1;    // UUID7, server-assigned
  string key_id = 2;      // owning key
  string jti = 3;         // JWT ID embedded in token
  google.protobuf.Timestamp iat = 4;
  google.protobuf.Timestamp exp = 5;
  optional string pol = 6;     // embedded policy JSON
  string token_hash = 7;       // SHA-256 of the raw token (hex)
  bool revoked = 8;
  google.protobuf.Timestamp created_at = 9;
}

// ── KeySecret (BYOK) messages ─────────────────────────────────────────────────

message CreateKeySecretRequest {
  string key_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  // upstream_target identifies the upstream (e.g. "openai", "anthropic").
  string upstream_target = 2 [(buf.validate.field).string = {min_len: 1 max_len: 255}];
  // value is the plaintext credential; stored encrypted, never returned.
  string value = 3 [(buf.validate.field).string = {min_len: 1 max_len: 8192}];
  optional string description = 4 [(buf.validate.field).string.max_len = 1024];
}

message CreateKeySecretResponse { KeySecret secret = 1; }

message GetKeySecretRequest {
  string key_secret_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetKeySecretResponse { KeySecret secret = 1; }

message ListKeySecretsRequest {
  string key_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional int32 limit = 2 [(buf.validate.field).int32 = {gte: 0 lte: 1000}];
  optional string page_token = 3;
}

message ListKeySecretsResponse {
  repeated KeySecret secrets = 1;
  string next_page_token = 2;
}

message RotateKeySecretRequest {
  string key_secret_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  string value = 2 [(buf.validate.field).string = {min_len: 1 max_len: 8192}];
}

message RotateKeySecretResponse { KeySecret secret = 1; }

message DeleteKeySecretRequest {
  string key_secret_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message DeleteKeySecretResponse {}

// KeySecret is a versioned upstream credential bound to a Key (BYOK).
// Overrides Workspace Secret during request dispatch for the same upstream_target.
message KeySecret {
  string key_secret_id = 1;    // UUID7, server-assigned
  string key_id = 2;           // owning key; immutable
  string upstream_target = 3;  // e.g. "openai"
  int32 version = 4;           // increments on rotate
  bool active = 5;
  optional string description = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}
