// admin.proto — SecretAdminService: management plane for orange secret lifecycle.
//
// Operators and CI pipelines use this surface to create, rotate, retire,
// and audit secrets. The delivery path (SecretResolverService in
// orange.secret.v1) is handled separately.
//
// Every mutation emits a change event so connected SecretResolverService
// subscribers refresh without polling.
//
// # Encryption key hierarchy
//
//   MASTER_KEK  (external provider — never stored in the database)
//     ↓ wraps
//   SERVICE_KEK (stored in realm="system"; created via CreateServiceKEK)
//     ↓ wraps
//   DEK         (one per secret version)
//     ↓ encrypts
//   Secret material
//
// # KEK modes (configured server-side)
//
//   pooled (default)
//     A shared pool of SERVICE_KEKs is used for all boundaries. Pool members
//     are pre-allocated via CreateServiceKEK (empty workspace_id + realm).
//     Once the pool is warm, runtime DEK creation never requires MASTER_KEK
//     access. Set server-side PoolSize to auto-provision the pool on the
//     first CreateVersion call.
//
//   per-boundary
//     One dedicated SERVICE_KEK per (workspace_id, realm) pair. Stronger
//     isolation; requires MASTER_KEK access for every new boundary.
//
// See design/20-secret-store.md in the pear reference implementation for
// the full design (schema, lifecycle model, KEK-DEK hierarchy).
//
// Field numbers are stable and must not be reused once released.

syntax = "proto3";

package orange.secret.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "orange/auth/v1/auth_options.proto";


// ── Service ───────────────────────────────────────────────────────────────────

service SecretAdminService {
  // CreateServiceKEK provisions a SERVICE_KEK. Two modes:
  //
  //   Pool member (workspace_id + realm both empty, default mode):
  //     Always creates a new pool member (svc-kek-pool-N, stored in
  //     realm="system"). Call this N times to pre-populate the pool, or rely
  //     on server-side PoolSize to auto-provision on first CreateVersion.
  //
  //   Per-boundary (workspace_id + realm both set):
  //     Idempotent — creates or returns the existing SERVICE_KEK for that
  //     (workspace_id, realm) boundary.
  rpc CreateServiceKEK(CreateServiceKEKRequest) returns (CreateServiceKEKResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // RotateServiceKEK re-wraps SERVICE_KEKs under the current active MASTER_KEK.
  // Inserts a new key version for each affected SERVICE_KEK; old versions are
  // preserved for decryption of DEKs that still reference them.
  //
  //   Pool rotation (workspace_id + realm both empty):
  //     Re-wraps all active pool members.
  //
  //   Per-boundary rotation (workspace_id + realm both set):
  //     Re-wraps only the SERVICE_KEK for that boundary.
  rpc RotateServiceKEK(RotateServiceKEKRequest) returns (RotateServiceKEKResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // CreateVersion creates a new version for a secret, optionally enabling it
  // immediately. The material is encrypted under a fresh DEK before storage.
  rpc CreateVersion(CreateVersionRequest) returns (CreateVersionResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // EnableVersion activates a previously created or disabled version.
  rpc EnableVersion(EnableVersionRequest) returns (EnableVersionResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // DisableVersion soft-suppresses a version (reversible). Material is preserved.
  rpc DisableVersion(DisableVersionRequest) returns (DisableVersionResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // RetireVersion permanently deactivates a version. Cannot be re-enabled.
  // Set shred=true to zero the material bytes for compliance use cases;
  // metadata (checksum, version, timestamps) is retained forever.
  rpc RetireVersion(RetireVersionRequest) returns (RetireVersionResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // ResolveVersion returns the current active material for a secret, including
  // full audit metadata. This is the management-plane equivalent of
  // SecretResolverService.Resolve; plaintext material is included in the response.
  rpc ResolveVersion(ResolveVersionRequest) returns (ResolveVersionResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListVersions returns all versions (active + retired) for a secret, ordered
  // by version_id (UUID7, ascending). Material is omitted in list responses.
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListSecrets returns secret IDs in a realm (or across all realms in a
  // workspace). Returns lightweight summaries; no material or version details.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ── Lifecycle enum ────────────────────────────────────────────────────────────

// VersionState is the lifecycle state of a single secret version.
enum VersionState {
  VERSION_STATE_UNSPECIFIED = 0;
  // Material is live; Resolve will return this version.
  VERSION_STATE_ENABLED = 1;
  // Temporarily suppressed; material preserved; can be re-enabled.
  VERSION_STATE_DISABLED = 2;
  // Permanently deactivated; cannot be re-enabled; material optionally shredded.
  VERSION_STATE_RETIRED = 3;
}

// ── Core record ───────────────────────────────────────────────────────────────

// SecretVersion is the canonical record for one version of a secret.
// Material is present only in CreateVersion and ResolveVersion responses;
// it is absent in all List* responses.
message SecretVersion {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string realm = 2 [(buf.validate.field).string.min_len = 1];
  string secret_id = 3 [(buf.validate.field).string.min_len = 1];
  string version_id = 4; // UUID7, sortable by creation time; server-assigned

  // Plaintext material. Present only in CreateVersion/ResolveVersion responses.
  optional bytes material = 5;

  string checksum = 10; // hex SHA-256 of the plaintext material bytes
  VersionState state = 11;

  // Audit fields — populated by the server, never by callers.
  google.protobuf.Timestamp created_at = 20;
  string created_by = 21;
  google.protobuf.Timestamp enabled_at = 22;
  string enabled_by = 23;
  google.protobuf.Timestamp disabled_at = 24;
  string disabled_by = 25;
  google.protobuf.Timestamp retired_at = 26;
  string retired_by = 27;
  google.protobuf.Timestamp shredded_at = 28;
}

// ── CreateServiceKEK ──────────────────────────────────────────────────────────

message CreateServiceKEKRequest {
  // Set both for a per-boundary SERVICE_KEK (idempotent).
  // Leave both empty to create a new pool-level SERVICE_KEK.
  string workspace_id = 1;
  string realm = 2;
}

message CreateServiceKEKResponse {
  // kek_id is the stable identifier for the SERVICE_KEK, encoding the boundary.
  string kek_id = 1;
  // kek_version is the version of the returned (or newly created) SERVICE_KEK.
  int32 kek_version = 2;
}

// ── RotateServiceKEK ──────────────────────────────────────────────────────────

message RotateServiceKEKRequest {
  // Per-boundary rotation: set both fields.
  // Pool rotation: leave both empty to re-wrap all active pool members.
  string workspace_id = 1;
  string realm = 2;
}

message RotateServiceKEKResponse {
  repeated RotatedKEK rotated = 1;
}

// RotatedKEK describes one SERVICE_KEK that was re-wrapped during a rotation.
message RotatedKEK {
  string kek_id = 1;
  int32 old_version = 2;
  int32 new_version = 3;
  // master_kek_version is the MASTER_KEK version used to wrap the new SERVICE_KEK.
  int32 master_kek_version = 4;
}

// ── CreateVersion ─────────────────────────────────────────────────────────────

message CreateVersionRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string realm = 2 [(buf.validate.field).string.min_len = 1];
  string secret_id = 3 [(buf.validate.field).string.min_len = 1];

  // material is the plaintext secret bytes. The server encrypts and stores them;
  // the plaintext is never persisted.
  bytes material = 4 [(buf.validate.field).bytes.min_len = 1];

  // enable causes the version to be immediately enabled after creation.
  // Default: false (version starts in DISABLED state).
  bool enable = 5;
}

message CreateVersionResponse {
  SecretVersion version = 1;
}

// ── EnableVersion ─────────────────────────────────────────────────────────────

message EnableVersionRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string realm = 2 [(buf.validate.field).string.min_len = 1];
  string secret_id = 3 [(buf.validate.field).string.min_len = 1];
  string version_id = 4 [(buf.validate.field).string.min_len = 1];
}

message EnableVersionResponse {
  SecretVersion version = 1;
}

// ── DisableVersion ────────────────────────────────────────────────────────────

message DisableVersionRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string realm = 2 [(buf.validate.field).string.min_len = 1];
  string secret_id = 3 [(buf.validate.field).string.min_len = 1];
  string version_id = 4 [(buf.validate.field).string.min_len = 1];
}

message DisableVersionResponse {
  SecretVersion version = 1;
}

// ── RetireVersion ─────────────────────────────────────────────────────────────

message RetireVersionRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string realm = 2 [(buf.validate.field).string.min_len = 1];
  string secret_id = 3 [(buf.validate.field).string.min_len = 1];
  string version_id = 4 [(buf.validate.field).string.min_len = 1];

  // shred zeros the material bytes after retiring for compliance use cases.
  // Metadata (checksum, version, timestamps) is retained regardless.
  bool shred = 5;
}

message RetireVersionResponse {
  // state=RETIRED; material is absent even when shred=false.
  SecretVersion version = 1;
}

// ── ResolveVersion ────────────────────────────────────────────────────────────

message ResolveVersionRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string realm = 2 [(buf.validate.field).string.min_len = 1];
  string secret_id = 3 [(buf.validate.field).string.min_len = 1];
}

message ResolveVersionResponse {
  SecretVersion version = 1;
}

// ── ListVersions ──────────────────────────────────────────────────────────────

message ListVersionsRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];
  string realm = 2 [(buf.validate.field).string.min_len = 1];
  string secret_id = 3 [(buf.validate.field).string.min_len = 1];
}

message ListVersionsResponse {
  // versions is ordered by version_id (UUID7, ascending = creation order).
  // Material is absent in list responses.
  repeated SecretVersion versions = 1;
}

// ── ListSecrets ───────────────────────────────────────────────────────────────

message ListSecretsRequest {
  string workspace_id = 1 [(buf.validate.field).string.min_len = 1];

  // realm is optional. When empty, lists secrets across all realms in the workspace.
  string realm = 2;
}

message ListSecretsResponse {
  repeated SecretSummary secrets = 1;
}

// SecretSummary is a lightweight identity record. No material or version details.
message SecretSummary {
  string workspace_id = 1;
  string realm = 2;
  string secret_id = 3;
}

// ── Change event ──────────────────────────────────────────────────────────────

// SecretChangedEvent is published to the broadcast bus after every mutation.
// Subscribers call Resolve to get fresh material; the event carries no material.
message SecretChangedEvent {
  string workspace_id = 1;
  string realm = 2;
  string secret_id = 3;
  string version_id = 4; // version_id of the version that changed state
}
