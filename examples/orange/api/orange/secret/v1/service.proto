// service.proto — SecretResolverService: client-facing secret delivery.
//
// Mirrors the config SnapshotService pattern but for named secrets managed
// by SecretAdminService. There are three entry points:
//
//   Resolve — hot path, per-secret, conditional.
//     The caller presents (workspace_id, realm, secret_id) plus optional
//     freshness hints (if_version, if_checksum). When both hints still match
//     the current store state the server returns Unchanged, saving a full
//     decrypt-and-copy round trip. Returns plaintext material.
//
//   Watch — metadata-only streaming channel.
//     The server pushes a fresh SecretSetSnapshot whenever any secret in the
//     workspace changes, plus Heartbeat on the idle timer to prove liveness.
//     Clients use the metadata to invalidate their per-secret caches before
//     issuing targeted Resolve calls. Watch never carries secret material.
//
//   Fetch — unary cold-start / reconnect equivalent of Watch.
//     Returns the current SecretSetSnapshot or Unchanged when the caller's
//     if_version + if_checksum still match. Also suitable for polling clients
//     that cannot hold a long-lived Watch stream.
//
// Secret material is transmitted only on Resolve. Watch and Fetch carry only
// identity + version + checksum — consumers verify freshness then call Resolve.
//
// Field numbers are stable and must not be reused once released.

syntax = "proto3";

package orange.secret.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";


// ── Service ───────────────────────────────────────────────────────────────────

service SecretResolverService {
  // Resolve is the hot path. Returns plaintext material for one secret.
  // When both if_version and if_checksum match the current store state,
  // returns Unchanged instead of decrypting and copying material.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);

  // Watch is the metadata-only streaming channel.
  // The server pushes a SecretSetSnapshot on any change in the workspace
  // and emits a Heartbeat on the idle timer to prove liveness.
  // Clients use the snapshot to invalidate caches; material is fetched via Resolve.
  rpc Watch(WatchRequest) returns (stream WatchResponse);

  // Fetch is the unary cold-start / reconnect equivalent of Watch.
  // Returns the current SecretSetSnapshot or Unchanged when freshness hints match.
  // Also suitable for polling clients that cannot hold a long-lived Watch stream.
  rpc Fetch(FetchRequest) returns (FetchResponse);
}

// ── Resolve ───────────────────────────────────────────────────────────────────

message ResolveRequest {
  // workspace_id identifies the tenant. Derived from caller identity on the
  // upstream wire; carry as an empty string for local Unix-socket calls where
  // the Worker populates it from peer-cred context.
  string workspace_id = 1;

  // realm groups secrets by purpose within a workspace (e.g. "api-keys", "certs").
  string realm = 2 [(buf.validate.field).string.min_len = 1];

  // secret_id is the logical name of the secret within the realm.
  string secret_id = 3 [(buf.validate.field).string.min_len = 1];

  // Conditional resolve: when both fields are set and both still match the
  // current store state, the server returns Unchanged instead of the full payload.
  optional string if_version = 4; // UUID7 of the last known enabled version
  optional string if_checksum = 5; // hex SHA-256 of the last known plaintext material
}

message ResolveResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    SecretPayload payload = 1; // plaintext material + metadata
    Unchanged unchanged = 2; // if_version + if_checksum still match
  }
}

// ── Watch ─────────────────────────────────────────────────────────────────────

message WatchRequest {
  string workspace_id = 1;

  // from_version is an optional resume hint (UUID7). If the server has
  // garbage-collected history past this version it returns OutOfRange;
  // the client recovers by issuing a fresh unconditional Fetch.
  optional string from_version = 2;
}

message WatchResponse {
  oneof event {
    option (buf.validate.oneof).required = true;

    SecretSetSnapshot snapshot = 1;
    Heartbeat heartbeat = 2;
  }
}

// ── Fetch ─────────────────────────────────────────────────────────────────────

message FetchRequest {
  string workspace_id = 1;

  // Conditional fetch: when both fields are set and both still match,
  // the response is Unchanged.
  optional string if_version = 2;
  optional string if_checksum = 3;
}

message FetchResponse {
  oneof result {
    option (buf.validate.oneof).required = true;

    SecretSetSnapshot snapshot = 1;
    Unchanged unchanged = 2;
    Heartbeat heartbeat = 3; // rate-limit signal; retry after a delay
  }
}

// ── Core types ────────────────────────────────────────────────────────────────

// SecretPayload carries resolved plaintext material for one secret version.
// Consumers verify SHA-256(material) == checksum before use.
message SecretPayload {
  string workspace_id = 1;
  string realm = 2;
  string secret_id = 3;

  // Plaintext secret material. Never logged or stored by the caller.
  bytes material = 4;

  string version = 10; // UUID7 of this enabled version
  string checksum = 11; // hex SHA-256 of material
  google.protobuf.Timestamp emitted_at = 12;
}

// SecretSetSnapshot is the full metadata view for one workspace's secret set.
// Carries IDs + version + checksum per entry but NOT materials — materials are
// fetched via Resolve.
message SecretSetSnapshot {
  string workspace_id = 1;
  repeated SecretEntry secrets = 2;

  string version = 10; // UUID7; advances on any entry change
  string checksum = 11; // hex SHA-256 of canonical snapshot bytes
  google.protobuf.Timestamp emitted_at = 12;
}

// SecretEntry is one row of the snapshot: identity + freshness metadata only.
message SecretEntry {
  string realm = 1;
  string secret_id = 2;
  string version = 3; // UUID7 of the current enabled version
  string checksum = 4; // hex SHA-256 of the secret's material
}

// Unchanged is returned by Resolve/Fetch when the caller's freshness hints
// (if_version + if_checksum) still match the current store state.
message Unchanged {
  string version = 1; // UUID7 that was compared
  string checksum = 2; // hex SHA-256 that was compared
}

// Heartbeat signals liveness on an idle Watch stream or rate-limits a Fetch.
message Heartbeat {
  google.protobuf.Timestamp at = 1;
}
