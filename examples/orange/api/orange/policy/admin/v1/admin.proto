// admin.proto — PolicyAdminService: policy lifecycle management.
//
// A Policy attaches rate-limit rules at Project, Workspace, or Key scope.
// Policy types:
//   floor    — hard guardrails set by org admins; cannot be narrowed by lower scopes
//   flexible — constraints that workspace/key owners may further restrict
//
// Evaluation order: Project → Workspace → Key
// Project-level policies establish organizational guardrails.
// Workspace and Key policies may only narrow, never widen Project constraints.
//
// PolicyRule mirrors the RateLimitRule from the config system design:
// zero values mean "unconstrained" for that dimension. Multiple limits on the
// same rule are independent — whichever is exhausted first triggers on_exceed.
// All matching rules across all scopes accumulate and are enforced simultaneously.
//
// policy_id is server-assigned as a UUID7.
//
// Authentication: every RPC requires AUTH_TYPE_API_KEY with scope "admin".
//
// Field numbers are stable and must not be reused once released.

syntax = "proto3";

package orange.policy.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "orange/auth/v1/auth_options.proto";

service PolicyAdminService {
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
}

enum PolicyScopeType {
  POLICY_SCOPE_TYPE_UNSPECIFIED = 0;
  POLICY_SCOPE_TYPE_PROJECT = 1;
  POLICY_SCOPE_TYPE_WORKSPACE = 2;
  POLICY_SCOPE_TYPE_KEY = 3;
}

enum PolicyType {
  POLICY_TYPE_UNSPECIFIED = 0;
  // floor policies are hard guardrails; lower scopes cannot widen them.
  POLICY_TYPE_FLOOR = 1;
  // flexible policies may be further restricted by lower scopes.
  POLICY_TYPE_FLEXIBLE = 2;
}

// OnExceed controls the action when a rate limit is exhausted.
enum OnExceed {
  ON_EXCEED_UNSPECIFIED = 0; // treated as ON_EXCEED_REJECT
  ON_EXCEED_REJECT = 1;
  ON_EXCEED_THROTTLE = 2;
  ON_EXCEED_LOG_ONLY = 3;
}

message CreatePolicyRequest {
  PolicyScopeType scope_type = 1;
  // scope_id is the UUID7 of the project, workspace, or key this policy attaches to.
  string scope_id = 2 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  PolicyType type = 3;
  optional string description = 4 [(buf.validate.field).string.max_len = 1024];
  // rules is the ordered list of rate-limit rules evaluated simultaneously.
  repeated PolicyRule rules = 5;
}

message CreatePolicyResponse { Policy policy = 1; }

message GetPolicyRequest {
  string policy_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetPolicyResponse { Policy policy = 1; }

message ListPoliciesRequest {
  optional PolicyScopeType scope_type = 1;
  // scope_id filters to policies attached to a specific resource.
  optional string scope_id = 2 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional PolicyType type = 3;
  optional int32 limit = 4 [(buf.validate.field).int32 = {gte: 0 lte: 1000}];
  optional string page_token = 5;
}

message ListPoliciesResponse {
  repeated Policy policies = 1;
  string next_page_token = 2;
}

message UpdatePolicyRequest {
  string policy_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional string description = 2 [(buf.validate.field).string.max_len = 1024];
  // rules replaces the entire rule set when non-empty.
  repeated PolicyRule rules = 3;
}

message UpdatePolicyResponse { Policy policy = 1; }

message DeletePolicyRequest {
  string policy_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message DeletePolicyResponse {}

// PolicyRule mirrors RateLimitRule from the config system design.
// Zero values mean "unconstrained" for that dimension. All matching rules
// across all scopes accumulate and are enforced simultaneously.
message PolicyRule {
  // models lists model IDs this rule applies to. Use ["*"] for all models.
  repeated string models = 1;

  double usd_per_minute = 2;
  double usd_per_hour   = 3;
  double usd_per_day    = 4;

  int32 rpm = 5;  // requests per minute
  int32 rph = 6;  // requests per hour
  int32 rpd = 7;  // requests per day

  int32 input_tokens_per_minute = 8;
  int32 input_tokens_per_hour   = 9;
  int32 input_tokens_per_day    = 10;

  int32 output_tokens_per_minute = 11;
  int32 output_tokens_per_hour   = 12;
  int32 output_tokens_per_day    = 13;

  int32 cache_read_tokens_per_hour  = 14;
  int32 cache_read_tokens_per_day   = 15;

  int32 cache_write_tokens_per_hour = 16;
  int32 cache_write_tokens_per_day  = 17;

  OnExceed on_exceed = 18;
}

// Policy attaches rate-limit rules at Project, Workspace, or Key scope.
message Policy {
  string policy_id = 1;       // UUID7, server-assigned
  PolicyScopeType scope_type = 2;
  string scope_id = 3;        // project_id, workspace_id, or key_id
  PolicyType type = 4;
  optional string description = 5;
  repeated PolicyRule rules = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}
