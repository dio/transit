// admin.proto — WorkspaceAdminService: lifecycle management for orange workspaces.
//
// A Workspace is owned by a Project and isolates users, keys, secrets,
// policies, and exactly one Egress instance. workspace_id is server-assigned
// as a UUID7 and is the foreign-key reference used by all child entities.
//
// Authentication: every RPC requires AUTH_TYPE_API_KEY with scope "admin".
// The gateway enforces this at the transport layer before any handler runs.
//
// Field numbers are stable and must not be reused once released.

syntax = "proto3";

package orange.workspace.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "orange/auth/v1/auth_options.proto";


// ── Service ───────────────────────────────────────────────────────────────────

service WorkspaceAdminService {
  // CreateWorkspace provisions a new workspace. The server assigns a UUID7
  // workspace_id; the caller supplies a unique name (slug).
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // GetWorkspace returns the workspace record for the given workspace_id.
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListWorkspaces returns all workspace records, sorted by created_at ascending.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // UpdateWorkspace replaces the mutable fields (display_name) of an existing workspace.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }

  // DeleteWorkspace permanently removes the workspace record. This does not
  // cascade-delete config, keys, or secrets; callers must clean those up first.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_API_KEY]
      scopes: ["admin"]
    };
  }
}

// ── Messages ──────────────────────────────────────────────────────────────────

message CreateWorkspaceRequest {
  // project_id is the UUID7 of the owning Project.
  string project_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];

  // name is the unique human-readable slug within the project (e.g. "prod").
  // Immutable after creation.
  string name = 2 [(buf.validate.field).string = {
    pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
    min_len: 2
    max_len: 63
  }];

  // description is a free-text annotation.
  optional string description = 3 [(buf.validate.field).string.max_len = 1024];
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message GetWorkspaceRequest {
  string workspace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 36
  }];
}

message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message ListWorkspacesRequest {
  // project_id filters results to workspaces within a specific project.
  string project_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional int32 limit = 2 [(buf.validate.field).int32 = {gte: 0 lte: 1000}];
  optional string page_token = 3;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
  string next_page_token = 2;
}

message UpdateWorkspaceRequest {
  string workspace_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional string description = 2 [(buf.validate.field).string.max_len = 1024];
}

message UpdateWorkspaceResponse {
  Workspace workspace = 1;
}

message DeleteWorkspaceRequest {
  string workspace_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message DeleteWorkspaceResponse {}

// Workspace isolates users, keys, secrets, policies, and one Egress instance.
message Workspace {
  string workspace_id = 1; // UUID7, server-assigned
  string project_id = 2;   // owning project; immutable
  string name = 3;         // unique within project; immutable
  optional string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  string egress_id = 7;    // auto-provisioned on creation; empty until provisioned
}
