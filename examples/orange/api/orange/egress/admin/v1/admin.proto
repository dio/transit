// admin.proto — EgressAdminService: Egress instance, identity, key-pair, and
// control-plane validation key management.
//
// A Workspace owns exactly one Egress. The Egress is the proxy instance
// responsible for request dispatch and policy enforcement.
//
// Connection model: signed assertion (not mTLS). The egress signs a
// well-known string with its X.509 identity private key; the CP verifies the
// signature and checks DB integrity. The same cert/key can be used for mTLS
// later by reconfiguring the egress — no proto changes required.
//
// Cryptographic artefacts per egress:
//   EgressIdentity    — X.509 cert (CN=egress.<ws>.<proj>.<org>) for signed assertion.
//   EgressKeyPair     — Ed25519 keypair for ongoing egress→CP auth (heartbeat/telemetry).
//   CPValidationKey   — CP public key; egress uses it to verify CP-signed config/telemetry.
//   EgressPASETOKeyPair #1/#2 — Ed25519 keypairs; CP signs user tokens with the private key,
//                               egress validates offline using the public key (no CP round-trip).
//                               Two pairs allow graceful rotation.
//
// egress_id, identity_id, keypair_id, cpvalidation_key_id are server-assigned UUID7s.
//
// Authentication: every RPC requires AUTH_TYPE_API_KEY with scope "admin"
// unless noted (GetEgressBundle requires "egress-bundle:download").
//
// Field numbers are stable and must not be reused once released.

syntax = "proto3";

package orange.egress.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "orange/auth/v1/auth_options.proto";

service EgressAdminService {
  // ── Egress CRUD ───────────────────────────────────────────────────────────

  rpc CreateEgress(CreateEgressRequest) returns (CreateEgressResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  rpc GetEgress(GetEgressRequest) returns (GetEgressResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateEgress(UpdateEgressRequest) returns (UpdateEgressResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  rpc DeleteEgress(DeleteEgressRequest) returns (DeleteEgressResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }

  // GetEgressBundle returns all files needed to boot an egress proxy: identity
  // cert, private key (returned once), and the CP validation public key.
  // Requires scope "egress-bundle:download".
  rpc GetEgressBundle(GetEgressBundleRequest) returns (GetEgressBundleResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["egress-bundle:download"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetEgressByWorkspace returns the egress record for a workspace (1:1).
  rpc GetEgressByWorkspace(GetEgressByWorkspaceRequest) returns (GetEgressByWorkspaceResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ── EgressIdentity management ─────────────────────────────────────────────

  // IssueIdentity provisions a new X.509 identity certificate for an Egress.
  rpc IssueIdentity(IssueIdentityRequest) returns (IssueIdentityResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  // GetIdentity returns the identity record for an Egress.
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListIdentities lists all identity records for an Egress (active and expired).
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RevokeIdentity deactivates an identity certificate.
  rpc RevokeIdentity(RevokeIdentityRequest) returns (RevokeIdentityResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }

  // ── EgressKeyPair management ──────────────────────────────────────────────

  // RotateKeyPair generates a new asymmetric key pair for egress authentication.
  rpc RotateKeyPair(RotateKeyPairRequest) returns (RotateKeyPairResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  // GetKeyPair returns the active key pair record for an Egress (public key only).
  rpc GetKeyPair(GetKeyPairRequest) returns (GetKeyPairResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListKeyPairs lists all key pair records for an Egress.
  rpc ListKeyPairs(ListKeyPairsRequest) returns (ListKeyPairsResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ── EgressPASETOKeyPair management ───────────────────────────────────────
  // Two PASETO keypairs are maintained per egress. The CP holds the private key
  // (signs user tokens); the egress holds the public key (validates offline).

  // RotatePASETOKeyPair generates a new Ed25519 PASETO keypair for the given
  // slot (1 or 2). The old public key remains valid during a grace window.
  rpc RotatePASETOKeyPair(RotatePASETOKeyPairRequest) returns (RotatePASETOKeyPairResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  rpc GetPASETOKeyPair(GetPASETOKeyPairRequest) returns (GetPASETOKeyPairResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListPASETOKeyPairs(ListPASETOKeyPairsRequest) returns (ListPASETOKeyPairsResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ── CPValidationKey management ────────────────────────────────────────────

  // CreateCPValidationKey registers a control-plane public key for distribution.
  rpc CreateCPValidationKey(CreateCPValidationKeyRequest) returns (CreateCPValidationKeyResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
  // GetCPValidationKey returns a control-plane validation key.
  rpc GetCPValidationKey(GetCPValidationKeyRequest) returns (GetCPValidationKeyResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListCPValidationKeys lists all control-plane validation keys.
  rpc ListCPValidationKeys(ListCPValidationKeysRequest) returns (ListCPValidationKeysResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // DeactivateCPValidationKey marks a control-plane key as inactive.
  rpc DeactivateCPValidationKey(DeactivateCPValidationKeyRequest) returns (DeactivateCPValidationKeyResponse) {
    option (orange.auth.v1.auth) = {auth_types: [AUTH_TYPE_API_KEY] scopes: ["admin"]};
  }
}

// ── Egress messages ───────────────────────────────────────────────────────────

message CreateEgressRequest {
  string workspace_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional string description = 2 [(buf.validate.field).string.max_len = 1024];
}

message CreateEgressResponse { Egress egress = 1; }

message GetEgressRequest {
  string egress_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetEgressResponse { Egress egress = 1; }

message UpdateEgressRequest {
  string egress_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional string description = 2 [(buf.validate.field).string.max_len = 1024];
  optional EgressStatus status = 3;
}

message UpdateEgressResponse { Egress egress = 1; }

message DeleteEgressRequest {
  string egress_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message DeleteEgressResponse {}

message GetEgressByWorkspaceRequest {
  string workspace_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetEgressByWorkspaceResponse { Egress egress = 1; }

message GetEgressBundleRequest {
  string egress_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetEgressBundleResponse {
  EgressBundle bundle = 1;
}

// EgressBundle contains everything needed to boot an egress proxy instance.
//
// Key roles:
//   identity_cert_pem               — who this egress is (X.509 cert, CN=egress.<ws>.<proj>.<org>)
//   egress_keypair_private_key_pem  — egress→CP direction: egress signs tokens with this private
//                                     key; CP verifies using the paired public key stored server-side
//   paseto_public_key_{1,2}_pem     — client→egress direction: egress validates user PASETO tokens
//                                     offline (no CP round-trip); two keys allow graceful rotation;
//                                     the CP holds the corresponding private keys for token signing
//
// Fields ending in _private_key_pem are sensitive — write to disk mode 0600,
// never log or retransmit.
message EgressBundle {
  string egress_id = 1;
  string workspace_id = 2;
  string server_url = 3;

  // identity_cert_pem identifies this egress to the CP (X.509 cert, public only).
  string identity_cert_pem = 4;

  reserved 5; // was identity_private_key_pem — not distributed; private key stays server-side
  reserved 7; // was cp_validation_public_key_pem — not used; CP does not push signed messages to egress

  // EgressKeyPair private key — egress→CP: egress signs heartbeat/telemetry tokens.
  // CP verifies with the corresponding public key stored in egress_keypairs.
  string egress_keypair_private_key_pem = 6;

  // EgressPASETOKeyPair public keys — client→egress: egress validates user PASETO tokens offline
  // (no CP round-trip per request). Two keys allow graceful keypair rotation.
  // The CP holds the corresponding private keys and uses them to sign user tokens.
  string paseto_public_key_1_pem = 8;
  string paseto_public_key_2_pem = 9;
}

// EgressStatus is the admin-controlled lifecycle state of an egress.
enum EgressStatus {
  EGRESS_STATUS_UNSPECIFIED = 0;
  EGRESS_STATUS_ACTIVE = 1;
  EGRESS_STATUS_INACTIVE = 2;
}

// EgressOnlineStatus reflects whether the egress proxy is currently reachable,
// as determined by heartbeat. Independent of EgressStatus.
enum EgressOnlineStatus {
  EGRESS_ONLINE_STATUS_UNSPECIFIED = 0;
  EGRESS_ONLINE_STATUS_UNKNOWN = 1;   // never connected since creation
  EGRESS_ONLINE_STATUS_ONLINE = 2;
  EGRESS_ONLINE_STATUS_OFFLINE = 3;
}

// Egress is the proxy instance owned by a Workspace (one-to-one).
message Egress {
  string egress_id = 1;               // UUID7, server-assigned
  string workspace_id = 2;            // owning workspace; immutable
  EgressStatus admin_status = 3;      // admin-controlled: is this egress allowed?
  string identity_id = 4;             // active EgressIdentity; empty until issued
  string keypair_id = 5;              // active EgressKeyPair; empty until rotated
  optional string description = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  EgressOnlineStatus online_status = 9;          // heartbeat-driven: is it up?
  google.protobuf.Timestamp last_seen_at = 10;   // last successful heartbeat
  string paseto_keypair_1_id = 11;               // active EgressPASETOKeyPair slot 1
  string paseto_keypair_2_id = 12;               // active EgressPASETOKeyPair slot 2
}

// ── EgressIdentity messages ───────────────────────────────────────────────────

message IssueIdentityRequest {
  string egress_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  // ttl_days is the certificate validity period.
  int32 ttl_days = 2 [(buf.validate.field).int32 = {gte: 1 lte: 3650}];
}

message IssueIdentityResponse { EgressIdentity identity = 1; }

message GetIdentityRequest {
  string identity_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetIdentityResponse { EgressIdentity identity = 1; }

message ListIdentitiesRequest {
  string egress_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional bool active_only = 2;
  optional int32 limit = 3 [(buf.validate.field).int32 = {gte: 0 lte: 1000}];
  optional string page_token = 4;
}

message ListIdentitiesResponse {
  repeated EgressIdentity identities = 1;
  string next_page_token = 2;
}

message RevokeIdentityRequest {
  string identity_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message RevokeIdentityResponse {}

// EgressIdentity is an X.509 certificate attesting workspace ownership.
message EgressIdentity {
  string identity_id = 1;    // UUID7, server-assigned
  string egress_id = 2;      // owning egress; immutable
  string certificate_pem = 3;
  string serial_number = 4;
  bool active = 5;
  google.protobuf.Timestamp issued_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}

// ── EgressKeyPair messages ────────────────────────────────────────────────────

enum KeyPairAlgorithm {
  KEY_PAIR_ALGORITHM_UNSPECIFIED = 0;
  KEY_PAIR_ALGORITHM_ED25519 = 1;
  KEY_PAIR_ALGORITHM_ECDSA_P256 = 2;
  KEY_PAIR_ALGORITHM_RSA_2048 = 3;
}

message RotateKeyPairRequest {
  string egress_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  KeyPairAlgorithm algorithm = 2;
}

message RotateKeyPairResponse { EgressKeyPair keypair = 1; }

message GetKeyPairRequest {
  string keypair_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetKeyPairResponse { EgressKeyPair keypair = 1; }

message ListKeyPairsRequest {
  string egress_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional bool active_only = 2;
  optional int32 limit = 3 [(buf.validate.field).int32 = {gte: 0 lte: 1000}];
  optional string page_token = 4;
}

message ListKeyPairsResponse {
  repeated EgressKeyPair keypairs = 1;
  string next_page_token = 2;
}

// EgressKeyPair is the asymmetric key pair for egress → control-plane auth.
// private_key_ref is an opaque reference to the private key in secure storage.
message EgressKeyPair {
  string keypair_id = 1;      // UUID7, server-assigned
  string egress_id = 2;       // owning egress; immutable
  KeyPairAlgorithm algorithm = 3;
  string public_key_pem = 4;
  string private_key_ref = 5; // opaque ref; never exposed to API callers
  bool active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp rotated_at = 8;
}

// ── EgressPASETOKeyPair messages ──────────────────────────────────────────────
// Two slots (slot 1 and slot 2) allow graceful key rotation: the egress
// validates tokens against both until the grace window expires.
// The CP holds the private key (signs user tokens); the egress receives only
// the public key (via EgressBundle) for offline verification.

message RotatePASETOKeyPairRequest {
  string egress_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  // slot must be 1 or 2.
  int32 slot = 2 [(buf.validate.field).int32 = {gte: 1 lte: 2}];
}

message RotatePASETOKeyPairResponse { EgressPASETOKeyPair keypair = 1; }

message GetPASETOKeyPairRequest {
  string paseto_keypair_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetPASETOKeyPairResponse { EgressPASETOKeyPair keypair = 1; }

message ListPASETOKeyPairsRequest {
  string egress_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
  optional bool active_only = 2;
  optional int32 limit = 3 [(buf.validate.field).int32 = {gte: 0 lte: 1000}];
  optional string page_token = 4;
}

message ListPASETOKeyPairsResponse {
  repeated EgressPASETOKeyPair keypairs = 1;
  string next_page_token = 2;
}

// EgressPASETOKeyPair holds one Ed25519 keypair used for user token signing.
// The CP signs PASETO v4.public tokens with the private key (stored in the
// secret service). The egress validates tokens with the public key offline.
message EgressPASETOKeyPair {
  string paseto_keypair_id = 1;  // UUID7, server-assigned
  string egress_id = 2;          // owning egress; immutable
  int32 slot = 3;                // 1 or 2
  string public_key_pem = 4;     // Ed25519 public key — distributed to egress
  string private_key_ref = 5;    // opaque ref to secret service; never exposed
  bool active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp rotated_at = 8;
}

// ── CPValidationKey messages ──────────────────────────────────────────────────

enum CPValidationKeyAlgorithm {
  CP_VALIDATION_KEY_ALGORITHM_UNSPECIFIED = 0;
  CP_VALIDATION_KEY_ALGORITHM_ED25519 = 1;
  CP_VALIDATION_KEY_ALGORITHM_ECDSA_P256 = 2;
}

enum CPValidationKeyPurpose {
  CP_VALIDATION_KEY_PURPOSE_UNSPECIFIED = 0;
  CP_VALIDATION_KEY_PURPOSE_TELEMETRY = 1;
  CP_VALIDATION_KEY_PURPOSE_REQUEST_VALIDATION = 2;
  CP_VALIDATION_KEY_PURPOSE_BOTH = 3;
}

message CreateCPValidationKeyRequest {
  CPValidationKeyAlgorithm algorithm = 1;
  string public_key_pem = 2 [(buf.validate.field).string = {min_len: 1 max_len: 4096}];
  CPValidationKeyPurpose purpose = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message CreateCPValidationKeyResponse { CPValidationKey key = 1; }

message GetCPValidationKeyRequest {
  string cpvalidation_key_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message GetCPValidationKeyResponse { CPValidationKey key = 1; }

message ListCPValidationKeysRequest {
  optional bool active_only = 1;
  optional CPValidationKeyPurpose purpose = 2;
  optional int32 limit = 3 [(buf.validate.field).int32 = {gte: 0 lte: 1000}];
  optional string page_token = 4;
}

message ListCPValidationKeysResponse {
  repeated CPValidationKey keys = 1;
  string next_page_token = 2;
}

message DeactivateCPValidationKeyRequest {
  string cpvalidation_key_id = 1 [(buf.validate.field).string = {min_len: 1 max_len: 36}];
}

message DeactivateCPValidationKeyResponse {}

// CPValidationKey is the control-plane public key distributed to egress instances.
message CPValidationKey {
  string cpvalidation_key_id = 1; // UUID7, server-assigned
  CPValidationKeyAlgorithm algorithm = 2;
  string public_key_pem = 3;
  CPValidationKeyPurpose purpose = 4;
  bool active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}
