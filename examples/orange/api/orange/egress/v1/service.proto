// service.proto — EgressService: egress-proxy-facing (non-admin) endpoints.
//
// Called by running egress proxy instances, not by admin clients.
// Authentication is by egress keypair assertion (full auth in a future step);
// no API key required on these RPCs.

syntax = "proto3";

package orange.egress.v1;

import "google/protobuf/timestamp.proto";
import "orange/auth/v1/auth_options.proto";

service EgressService {
  // Heartbeat is called periodically by the egress proxy to report liveness.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {
    option (orange.auth.v1.auth) = {
      auth_types: [AUTH_TYPE_EGRESS_ASSERTION]
    };
  }
}

// HeartbeatRequest carries no fields; egress_id and workspace_id are extracted
// from the X-Egress-Assertion header by the server-side interceptor.
message HeartbeatRequest {}

message HeartbeatResponse {
  google.protobuf.Timestamp server_time = 1;
}
