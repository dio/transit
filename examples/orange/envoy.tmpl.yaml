## examples/orange/envoy.tmpl.yaml - M0 wiring.
##
## Rendered to envoy.yaml at `make run` time via envsubst. The only template
## variable is ${ORANGE_TRUSTED_CA} (TLS trust bundle path); the Makefile picks
## an OS-aware default but you can override it from the env.
##
## - Downstream HCM hosts the classify filter.
## - Upstream HTTP filter chain hosts credinject.
## - The cluster uses the dynamic-modules cluster type (hostpick).
##
## Modules load orange.yaml lazily via the ORANGE_CONFIG env var (see Makefile
## `run` target). Per-filter `filter_config` is intentionally empty for now.

static_resources:
  listeners:
    - name: orange
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: orange
                http_filters:
                  - name: orange-classify
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: orange
                      filter_name: orange-classify
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: orange
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: orange_default }

  clusters:
    - name: orange_default
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      # Per-host TLS via transport_socket_matches. hostpick.Init publishes each
      # host with `sni` metadata (HostSpec.Metadata → envoy.transport_socket_match
      # namespace); Envoy picks the matching UpstreamTlsContext per connection so
      # OpenAI and Anthropic each handshake with their own SNI + SAN match
      # against the same dynamic cluster. See
      # .agents/skills/transit-body-driven-cluster-routing/SKILL.md ("Auto-SNI
      # sampling time" — workaround #3).
      transport_socket_matches:
        - name: openai
          match:
            sni: api.openai.com
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: api.openai.com
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: ${ORANGE_TRUSTED_CA}
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: api.openai.com
        - name: anthropic
          match:
            sni: api.anthropic.com
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: api.anthropic.com
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: ${ORANGE_TRUSTED_CA}
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: api.anthropic.com
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: orange-credinject
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: orange
                filter_name: orange-credinject
                filter_config:
                  "@type": type.googleapis.com/google.protobuf.StringValue
                  value: '{}'
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: orange
          cluster_name: orange-hostpick
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{}'

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
