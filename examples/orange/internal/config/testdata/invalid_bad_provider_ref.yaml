llm:
  # models[].provider references a name that does not exist in providers.
  providers:
    openai:
      kind: openai
      endpoint: https://api.openai.com
      auth:
        type: bearer
        secret_ref: env://TEST_OPENAI_KEY

  models:
    gpt-4o:
      provider: openai
    claude-sonnet:
      provider: anthropic_direct   # not defined in providers
