providers:
  openai:
    kind: openai
    endpoint: https://api.openai.com
    auth:
      type: bearer
      secret_ref: env://TEST_OPENAI_KEY

  anthropic:
    kind: anthropic
    endpoint: https://api.anthropic.com
    extra:
      anthropic_version: "2023-06-01"
    auth:
      type: anthropic
      secret_ref: env://TEST_ANTHROPIC_KEY

  azure:
    kind: openai
    backend_schema: azureopenai
    endpoint: https://my-resource.openai.azure.com
    path_prefix: "/openai/deployments/my-deployment"
    extra:
      azure_api_version: "2025-01-01-preview"
    auth:
      type: bearer
      secret_ref: env://TEST_AZURE_KEY

  bedrock:
    kind: anthropic
    backend_schema: awsanthropic
    endpoint: https://bedrock-runtime.us-west-2.amazonaws.com
    extra:
      aws_region: us-west-2
    auth:
      type: aws

  vertex:
    kind: openai
    backend_schema: gcpvertexai
    endpoint: https://us-central1-aiplatform.googleapis.com
    extra:
      gcp_project: my-project
      gcp_location: us-central1
    auth:
      type: gcp

  vertex_anthropic:
    kind: anthropic
    backend_schema: gcpanthropic
    endpoint: https://us-east5-aiplatform.googleapis.com
    extra:
      anthropic_version: "2023-06-01"
      gcp_project: my-project
      gcp_location: us-east5
    auth:
      type: gcp

  groq:
    kind: openai
    endpoint: https://api.groq.com
    path_prefix: "/openai/v1"
    auth:
      type: bearer
      secret_ref: env://TEST_GROQ_KEY

  deepinfra:
    kind: openai
    endpoint: https://api.deepinfra.com
    path_prefix: "/v1/openai"
    auth:
      type: bearer
      secret_ref: env://TEST_DEEPINFRA_KEY

models:
  # Direct OpenAI models.
  gpt-4o:
    provider: openai
  gpt-4.1:
    provider: openai

  # Anthropic direct — one canonical ID, one short alias.
  claude-3-5-sonnet-20241022:
    provider: anthropic
  claude-sonnet:
    provider: anthropic
    name: claude-3-5-sonnet-20241022

  # Azure — routes through a fixed deployment; client picks by logical name.
  azure/gpt-4o:
    provider: azure
    name: gpt-4o
    metadata:
      description: "GPT-4o via Azure OpenAI."
      context_length: 128000

  # Bedrock — strips gateway prefix, sends versioned Bedrock model ID.
  bedrock/claude-3-5-sonnet:
    provider: bedrock
    name: anthropic.claude-3-5-sonnet-20241022-v2:0
    metadata:
      description: "Claude 3.5 Sonnet via AWS Bedrock."
      tags: ["chat"]

  # Vertex AI — Gemini.
  gemini-1.5-pro:
    provider: vertex
    metadata:
      context_length: 1048576
      tags: ["chat", "vision", "long-context"]

  # Vertex AI — Anthropic (gcpanthropic translator).
  vertex/claude-3-5-sonnet:
    provider: vertex_anthropic
    name: claude-3-5-sonnet-20241022
    metadata:
      description: "Claude 3.5 Sonnet via Vertex AI."
      tags: ["chat"]

  # Groq — fast inference, flat model name.
  groq/llama-3.1-8b-instant:
    provider: groq
    name: llama-3.1-8b-instant
    metadata:
      description: "Llama 3.1 8B served by Groq for low-latency inference."
      context_length: 131072
      max_tokens: 8192
      tags: ["chat", "fast"]

  # DeepInfra — provider-prefixed compound model names.
  deepinfra/microsoft/phi-4:
    provider: deepinfra
    name: microsoft/phi-4
  deepinfra/meta-llama/Llama-3.3-70B-Instruct:
    provider: deepinfra
    name: meta-llama/Llama-3.3-70B-Instruct
