llm:
  providers:
    anthropic:
      kind: anthropic
      auth:
        type: anthropic
        secret_ref: env://PICK_TEST_KEY
      bindings:
        - name: us-east
          endpoint: https://api.anthropic.com
        - name: us-west
          endpoint: https://api-west.anthropic.com
        - name: us-central
          endpoint: https://api-central.anthropic.com
  models:
    # Only us-east is referenced; us-west and us-central are catalog-only
    # (no model entry points at them). applyResolved must still register all three.
    claude-east:
      provider: anthropic
      binding: us-east
      name: claude-haiku-4-5-20251001
