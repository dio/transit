llm:
  providers:
    github_models:
      kind: openai
      endpoint: https://models.inference.ai.azure.com
      path_prefix: ""
      auth:
        type: bearer
        secret_ref: env://GITHUB_TOKEN

  models:
    gpt-4o-mini:
      provider: github_models
      metadata:
        tier: fast

mcp:
  profiles:
    default:
      servers: [kiwi, aws-knowledge, github]
      auth:
        github:
          type: bearer
          secret_ref: env://GITHUB_TOKEN
  servers:
    kiwi:
      endpoint: https://mcp.kiwi.com
      tools:
        include: ["search-flight"]
    aws-knowledge:
      endpoint: https://knowledge-mcp.global.api.aws
      tools:
        include: ["aws____read_documentation", "aws____search_documentation"]
    github:
      endpoint: https://api.githubcopilot.com/mcp/
      auth:
        type: bearer
        secret_ref: env://GITHUB_TOKEN
      tools:
        include: ["search_repositories", "get_file_contents"]
