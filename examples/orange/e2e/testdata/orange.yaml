providers:
  github_models:
    kind: openai
    endpoint: https://models.inference.ai.azure.com
    path_prefix: ""
    auth:
      type: bearer
      secret: env://GITHUB_TOKEN

models:
  - match: "gpt-4o-mini"
    provider: github_models

classify:
  model_field: model
  on_miss:
    status: 404
    code: orange.model_not_found

translate:
  strip_request_headers:
    - authorization

hostpick:
  upstream_key: orange.upstream
