llm:
  providers:
    primary:
      kind: anthropic
      # TEST-NET-1 (RFC 5737) — routed nowhere, times out cleanly.
      endpoint: https://192.0.2.1
      extra:
        anthropic_version: "2023-06-01"
      auth:
        type: bearer
        secret_ref: literal://fake
    primary2:
      kind: anthropic
      endpoint: https://192.0.2.2
      extra:
        anthropic_version: "2023-06-01"
      auth:
        type: bearer
        secret_ref: literal://fake
    primary3:
      kind: anthropic
      endpoint: https://192.0.2.3
      extra:
        anthropic_version: "2023-06-01"
      auth:
        type: bearer
        secret_ref: literal://fake
    vertex_anthropic:
      kind: anthropic
      backend_schema: gcpanthropic
      endpoint: https://us-east5-aiplatform.googleapis.com
      extra:
        anthropic_version: "vertex-2023-10-16"
        gcp_project: env://GCP_PROJECT
        gcp_location: us-east5
      auth:
        type: gcp
        secret_ref: env://GCP_SERVICE_ACCOUNT_JSON
  models:
    claude-haiku-4-5:
      provider: primary

keys:
  demo/dio/sk-fallback:
    routing_overrides:
      claude-haiku-4-5:
        chain:
          retry:
            retry_on: "connect-failure,reset,5xx,retriable-status-codes"
            per_try_timeout_ms: 10000
          children:
            - target: { provider: primary,  name: claude-haiku-4-5 }
            - target: { provider: primary2, name: claude-haiku-4-5 }
            - target: { provider: primary3, name: claude-haiku-4-5 }
            - target: { provider: vertex_anthropic, name: claude-opus-4@20250514 }
