static_resources:
  listeners:
    - name: cluster-filter-state
      address:
        socket_address: { address: 127.0.0.1, port_value: {{.ProxyPort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: cluster-filter-state
                http_filters:
                  - name: filter-state-writer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: cluster-filter-state
                      filter_name: filter-state-writer
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: cluster-filter-state
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: upstream }

  clusters:
    - name: upstream
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: cluster-filter-state
          cluster_name: filter-state-router
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{"hosts":[{"address":"127.0.0.1:{{.UpstreamAPort}}"},{"address":"127.0.0.1:{{.UpstreamBPort}}"}]}'

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: {{.AdminPort}} }
