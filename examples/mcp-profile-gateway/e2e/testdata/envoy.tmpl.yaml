static_resources:
  listeners:
  - name: mcp-profile-gateway
    address:
      socket_address:
        address: 127.0.0.1
        port_value: {{ .ProxyPort }}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: mcp_profile_gateway
          http_filters:
          - name: mcp-profile-gateway
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              dynamic_module_config:
                name: mcp-profile-gateway
              filter_name: mcp-profile-gateway
              filter_config:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: '{}'
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local
            virtual_hosts:
            - name: local
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  # Body-callback HTTPCallout needs a reachable fallback
                  # upstream. A refused-port blackhole can complete the stream
                  # before OnHttpCalloutDone sends the local response.
                  cluster: l2-catalog

  clusters:
  - name: l2-catalog
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: l2-catalog
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: {{ .L2Port }}

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: {{ .AdminPort }}
