static_resources:
  listeners:
    - name: cluster-router
      address:
        socket_address: { address: 127.0.0.1, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: cluster_router
                http_filters:
                  - name: cluster-router-debug
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: cluster-router
                      filter_name: cluster-router-debug
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: cluster-router
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: cluster-router }

  clusters:
    - name: cluster-router
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: cluster-router-upstream
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: cluster-router
                filter_name: cluster-router-upstream
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: cluster-router
          cluster_name: cluster-router
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{"initial":{"version":"local","models":{"gpt-fast":{"target":"localhost:8081","provider":"openai","auth_header":"Bearer openai-token"},"gpt-slow":{"target":"localhost:8081","provider":"openai","auth_header":"Bearer slow-token"},"claude-safe":{"target":"localhost:8082","provider":"anthropic","auth_header":"Bearer anthropic-token"},"kimi-fast":{"target":"localhost:8083","provider":"moonshot","auth_header":"Bearer moonshot-token"}}}}'

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
