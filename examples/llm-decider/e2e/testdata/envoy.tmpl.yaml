static_resources:
  listeners:
    - name: llm-decider
      address:
        socket_address: { address: 127.0.0.1, port_value: {{.ProxyPort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: llm_decider

                # Entry point 5: the access logger, called once the stream ends.
                access_log:
                  - name: envoy.access_loggers.dynamic_modules
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.dynamic_modules.v3.DynamicModuleAccessLog
                      dynamic_module_config:
                        name: llm-decider
                      logger_name: llm-decider-accesslog
                      logger_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{}'

                http_filters:
                  # Entry point 1: the downstream filter, which makes the decision.
                  - name: llm-decider
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: llm-decider
                      filter_name: llm-decider
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

                route_config:
                  name: llm-decider
                  virtual_hosts:
                    - name: local
                      domains: ["*"]
                      routes:
                        # /lb exercises entry point 4 on its own cluster.
                        - match: { prefix: "/lb" }
                          route: { cluster: models-lb }
                        - match: { prefix: "/" }
                          route: { cluster: models }

  clusters:
    # Entry points 3 and 2: the module owns this cluster's hosts, and the cluster
    # carries the upstream filter. Host selection reads the decided model.
    - name: models
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: llm-decider-upstream
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: llm-decider
                filter_name: llm-decider-upstream
                filter_config:
                  "@type": type.googleapis.com/google.protobuf.StringValue
                  value: '{}'
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      cluster_type:
        name: envoy.clusters.dynamic_modules
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
          dynamic_module_config:
            name: llm-decider
          cluster_name: llm-decider-cluster
          cluster_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{"hosts":[{"address":"127.0.0.1:{{.SmartPort}}","model":"smart"},{"address":"127.0.0.1:{{.CheapPort}}","model":"cheap"}]}'

    # Entry point 4: Envoy owns this cluster's hosts; the module chooses.
    - name: models-lb
      connect_timeout: 5s
      type: STATIC
      lb_policy: LOAD_BALANCING_POLICY_CONFIG
      load_balancing_policy:
        policies:
          - typed_extension_config:
              name: envoy.load_balancing_policies.dynamic_modules
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.load_balancing_policies.dynamic_modules.v3.DynamicModulesLoadBalancerConfig
                dynamic_module_config:
                  name: llm-decider
                lb_policy_name: llm-decider-lb
      load_assignment:
        cluster_name: models-lb
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.CheapPort}} }

    # The judge endpoint. Envoy owns TLS and credentials for it in a deployment;
    # here it is a local stub.
    - name: llm-decider-judge
      connect_timeout: 1s
      type: STATIC
      load_assignment:
        cluster_name: llm-decider-judge
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.JudgePort}} }

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: {{.AdminPort}} }
