admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: {{.AdminPort}} }

static_resources:
  listeners:
    - name: main
      address:
        socket_address: { address: 127.0.0.1, port_value: {{.ProxyPort}} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                upgrade_configs:
                  - upgrade_type: websocket
                http_filters:
                  - name: ws-proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: ws-proxy
                      filter_name: ws-proxy
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: '{"listen_addr":"127.0.0.1:{{.LoopbackPort}}"}'
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: main
                  virtual_hosts:
                    - name: services
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                            headers:
                              - name: upgrade
                                string_match:
                                  exact: websocket
                                  ignore_case: true
                          route:
                            cluster: ws-proxy-local
                            upgrade_configs:
                              - upgrade_type: websocket
                            timeout: 0s
                        - match: { prefix: "/" }
                          route:
                            cluster: mock-upstream
                            timeout: 5s

  clusters:
    - name: ws-proxy-local
      type: STATIC
      load_assignment:
        cluster_name: ws-proxy-local
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.LoopbackPort}} }

    # In e2e the mock upstream handles all non-WS HTTP and WS connections directly.
    # ws-auth upstream filter is omitted here — credentials are not needed against the mock.
    - name: mock-upstream
      type: STATIC
      load_assignment:
        cluster_name: mock-upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: {{.MockPort}} }
