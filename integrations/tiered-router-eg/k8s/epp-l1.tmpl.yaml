apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: l1-cluster-shard-router
  namespace: transit-dataplane
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: l1
  type: JSONPatch
  jsonPatches:
  - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
    name: tcp-80
    operation:
      op: add
      path: "/default_filter_chain/filters/0/typed_config/http_filters/0"
      value:
        name: cluster-shard-router-debug
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
          dynamic_module_config:
            name: cluster-shard-router
          filter_name: cluster-shard-router-debug
  - type: "type.googleapis.com/envoy.config.cluster.v3.Cluster"
    name: "{{.ClusterName}}"
    operation:
      op: replace
      path: ""
      value:
        name: "{{.ClusterName}}"
        connect_timeout: 5s
        lb_policy: CLUSTER_PROVIDED
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http_protocol_options: {}
            http_filters:
            - name: cluster-shard-router-upstream
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                dynamic_module_config:
                  name: cluster-shard-router
                filter_name: cluster-shard-router-upstream
            - name: envoy.filters.http.upstream_codec
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
        cluster_type:
          name: envoy.clusters.dynamic_modules
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
            dynamic_module_config:
              name: cluster-shard-router
            cluster_name: cluster-shard-router
            cluster_config:
              "@type": type.googleapis.com/google.protobuf.StringValue
              value: '{"initial":{"version":"l1-to-l2","default_shard":"a","shards":{"a":{"target":"l2-a.transit-dataplane.svc.cluster.local:80","prefixes":["a"],"shard":"a","status":"active"},"b":{"target":"l2-b.transit-dataplane.svc.cluster.local:80","prefixes":["b"],"shard":"b","status":"active"}}}}'
