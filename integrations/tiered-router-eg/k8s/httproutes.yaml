apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: l1-public
  namespace: transit-dataplane
spec:
  parentRefs:
  - name: l1
  hostnames:
  - tiered-router.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: l1-placeholder-backend
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: l2-a
  namespace: transit-dataplane
spec:
  parentRefs:
  - name: l2-a
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: l2-a-placeholder-backend
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: l2-b
  namespace: transit-dataplane
spec:
  parentRefs:
  - name: l2-b
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: l2-b-placeholder-backend
      port: 8080
