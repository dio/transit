apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiered-router-control
  namespace: transit-dataplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiered-router-control
  template:
    metadata:
      labels:
        app: tiered-router-control
    spec:
      containers:
      - name: control
        image: "{{.ControlPlaneImage}}"
        imagePullPolicy: IfNotPresent
        args: ["control", "--addr=:8080"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tiered-router-control
  namespace: transit-dataplane
spec:
  selector:
    app: tiered-router-control
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: l1-placeholder-backend
  namespace: transit-dataplane
spec:
  selector:
    app: tiered-router-control
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
