apiVersion: apps/v1
kind: Deployment
metadata:
  name: l1-placeholder-backend
  namespace: transit-dataplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: l1-placeholder-backend
  template:
    metadata:
      labels:
        app: l1-placeholder-backend
    spec:
      containers:
      - name: placeholder
        image: "{{.DemoImage}}"
        imagePullPolicy: IfNotPresent
        args: ["placeholder", "--addr=:8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: l1-placeholder-backend
  namespace: transit-dataplane
spec:
  selector:
    app: l1-placeholder-backend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
