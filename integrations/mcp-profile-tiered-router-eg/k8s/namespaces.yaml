apiVersion: v1
kind: Namespace
metadata:
  name: transit-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: transit-dataplane
  labels:
    transit.dio/gateway-routes: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: envoy-gateway-infra-manager
  namespace: transit-dataplane
rules:
- apiGroups: [""]
  resources:
  - configmaps
  - serviceaccounts
  - services
  verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "watch"]
- apiGroups: ["apps"]
  resources:
  - daemonsets
  - deployments
  verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "watch"]
- apiGroups: ["autoscaling", "policy"]
  resources:
  - horizontalpodautoscalers
  - poddisruptionbudgets
  verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "watch"]
- apiGroups: ["certificates.k8s.io"]
  resources:
  - clustertrustbundles
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: envoy-gateway-infra-manager
  namespace: transit-dataplane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: envoy-gateway-infra-manager
subjects:
- kind: ServiceAccount
  name: envoy-gateway
  namespace: transit-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-profile-tiered-router-eg-token-reviewer
rules:
- apiGroups: ["authentication.k8s.io"]
  resources:
  - tokenreviews
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-profile-tiered-router-eg-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-profile-tiered-router-eg-token-reviewer
subjects:
- kind: ServiceAccount
  name: envoy-gateway
  namespace: transit-system
