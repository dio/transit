apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: l1
  namespace: transit-dataplane
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: l1
        type: ClusterIP
        labels:
          transit.dio/proxy: l1
      envoyDeployment:
        pod:
          labels:
            transit.dio/proxy: l1
        container:
          image: "{{.EnvoyImage}}"
          env:
          - name: GODEBUG
            value: "cgocheck=0"
          - name: ENVOY_DYNAMIC_MODULES_SEARCH_PATH
            value: "/etc/envoy/dynamic-modules"
          - name: MCP_PROFILE_GATEWAY_CONFIG
            value: '{{.L1ConfigJSON}}'
  dynamicModules:
  - name: mcp-profile-gateway
    source:
      type: Local
      local:
        path: /etc/envoy/dynamic-modules/libmcp-profile-gateway.so
    doNotClose: true
    loadGlobally: false
---
