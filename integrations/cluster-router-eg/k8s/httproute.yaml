apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cluster-router
  namespace: default
spec:
  parentRefs:
  - name: cluster-router
  hostnames:
  - cluster-router.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: cluster-router-backend
      port: 8080
