apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-router-control
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-router-control
  template:
    metadata:
      labels:
        app: cluster-router-control
    spec:
      containers:
      - name: control
        image: "{{.ControlPlaneImage}}"
        imagePullPolicy: IfNotPresent
        args: ["control", "--addr=:8080"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-router-control
  namespace: default
spec:
  selector:
    app: cluster-router-control
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-router-backend
  namespace: default
spec:
  selector:
    app: cluster-router-control
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
