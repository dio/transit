apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ws-proxy
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDeployment:
        container:
          image: "{{.EnvoyImage}}"
          env:
          - name: GODEBUG
            value: "cgocheck=0"
          - name: ENVOY_DYNAMIC_MODULES_SEARCH_PATH
            value: "/etc/envoy/dynamic-modules"
  dynamicModules:
  - name: ws-proxy
    source:
      type: Local
      local:
        path: /etc/envoy/dynamic-modules/libws-proxy.so
    doNotClose: true
    loadGlobally: false
