# Placeholder backend Service the HTTPRoute references. EG generates a cluster
# for it; the EnvoyPatchPolicy replaces that cluster wholesale before traffic
# flows here.
apiVersion: v1
kind: Service
metadata:
  name: cluster-async-router-backend
  namespace: default
spec:
  selector:
    app: upstream-a
  ports:
  - name: http
    port: 8080
    targetPort: 8080
