apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream-a
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upstream-a
  template:
    metadata:
      labels:
        app: upstream-a
    spec:
      containers:
      - name: upstream
        image: "{{.DemoImage}}"
        imagePullPolicy: IfNotPresent
        args: ["upstream", "--name=upstream-a", "--addr=:8080"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: upstream-a
  namespace: default
spec:
  selector:
    app: upstream-a
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
