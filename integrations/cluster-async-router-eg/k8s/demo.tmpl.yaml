---
# upstream-c serves HTTPS only — leaf cert is mounted from the
# tls-host-c Secret created by the e2e harness. The container's GetCertificate
# rejects any ClientHello whose SNI != host-c.test, which is the tripwire that
# catches HostSpec.Metadata → transport_socket_matches regressions end-to-end.
# Plaintext /healthz lives on :8080 so the kubelet probe doesn't need TLS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream-c
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upstream-c
  template:
    metadata:
      labels:
        app: upstream-c
    spec:
      containers:
      - name: upstream
        image: "{{.DemoImage}}"
        imagePullPolicy: IfNotPresent
        args:
        - "upstream-tls"
        - "--name=upstream-c"
        - "--expected-sni=host-c.test"
        - "--addr=:8443"
        - "--healthz-addr=:8080"
        - "--cert-file=/etc/tls/tls.crt"
        - "--key-file=/etc/tls/tls.key"
        ports:
        - containerPort: 8443
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        volumeMounts:
        - name: tls
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: tls-host-c
---
apiVersion: v1
kind: Service
metadata:
  name: upstream-c
  namespace: default
spec:
  selector:
    app: upstream-c
  ports:
  - name: https
    port: 8443
    targetPort: 8443
---
