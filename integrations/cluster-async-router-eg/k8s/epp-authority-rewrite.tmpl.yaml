# EnvoyPatchPolicy variant: :authority rewrite from body phase (WS-B delta-c).
#
# Research question (timing trap): does auto_sni capture :authority before or
# after a body-phase filter (Lua here) rewrites it?
#
# Two HCM patches:
#   0. Lua filter that buffers the request body, extracts {"target":"c|d"}, and
#      rewrites :authority to host-c.test / host-d.test respectively.
#   1. body-router-writer at position 1 (same as baseline, shifted by 1 due to
#      Lua sitting at position 0).
#
# Cluster patch: same as epp-auto-host-sni.tmpl.yaml (auto_sni: true, no
# explicit sni in UpstreamTlsContext). If auto_sni reads :authority after the
# body phase, c/d will get the correct SNI → 200. If it reads :authority at
# headers time (before body phase), the SNI will still be the gateway hostname
# and c/d will get non-2xx. The test logs the observation without asserting.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: cluster-async-router
  namespace: default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: cluster-async-router
  type: JSONPatch
  jsonPatches:
  - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
    name: tcp-80
    operation:
      op: add
      path: "/default_filter_chain/filters/0/typed_config/http_filters/0"
      value:
        name: envoy.filters.http.lua
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
          default_source_code:
            inline_string: |
              local t2a = {c="host-c.test", d="host-d.test"}
              function envoy_on_request(h)
                local body = h:body(true)
                if body == nil then return end
                local s = body:getBytes(0, body:length())
                local tgt = string.match(s, '"target"%s*:%s*"(%w+)"')
                if tgt then
                  local auth = t2a[tgt]
                  if auth then h:headers():replace(":authority", auth) end
                end
              end
  - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
    name: tcp-80
    operation:
      op: add
      path: "/default_filter_chain/filters/0/typed_config/http_filters/1"
      value:
        name: body-router-writer
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
          dynamic_module_config:
            name: cluster-async-router
          filter_name: body-router-writer
          filter_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{}'
  - type: "type.googleapis.com/envoy.config.cluster.v3.Cluster"
    name: "{{.ClusterName}}"
    operation:
      op: replace
      path: ""
      value:
        name: "{{.ClusterName}}"
        connect_timeout: 5s
        lb_policy: CLUSTER_PROVIDED
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http_protocol_options: {}
            upstream_http_protocol_options:
              auto_sni: true
              auto_san_validation: true
        transport_socket_matches:
        - name: host-c
          match: { sni: host-c.test }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                validation_context:
                  trusted_ca: { filename: /etc/envoy/tls/ca.pem }
        - name: host-d
          match: { sni: host-d.test }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                validation_context:
                  trusted_ca: { filename: /etc/envoy/tls/ca.pem }
        cluster_type:
          name: envoy.clusters.dynamic_modules
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
            dynamic_module_config:
              name: cluster-async-router
            cluster_name: body-router-cluster
            cluster_config:
              "@type": type.googleapis.com/google.protobuf.StringValue
              value: '{"hosts":[{"name":"a","address":"upstream-a.default.svc.cluster.local:8080"},{"name":"b","address":"upstream-b.default.svc.cluster.local:8080"},{"name":"c","address":"upstream-c.default.svc.cluster.local:8443","sni":"host-c.test"},{"name":"d","address":"upstream-d.default.svc.cluster.local:8443","sni":"host-d.test"}]}'
