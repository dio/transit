# EnvoyPatchPolicy for cluster-async-router-eg.
#
# Two patches:
#   1. Insert the body-router-writer HTTP filter at the head of the HCM
#      filter chain so it parses {"target":...} before the router runs.
#   2. Replace the EG-generated backend cluster with a CLUSTER_PROVIDED
#      dynamic-modules cluster whose Go extension performs async ChooseHost
#      after the body resolves.
#
# ClusterName is the XDSNameSchemeV2 cluster name discovered at e2e time from
# Envoy admin /config_dump (usually
# httproute/default/cluster-async-router/rule/0).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: cluster-async-router
  namespace: default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: cluster-async-router
  type: JSONPatch
  jsonPatches:
  - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
    name: tcp-80
    operation:
      op: add
      path: "/default_filter_chain/filters/0/typed_config/http_filters/0"
      value:
        name: body-router-writer
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
          dynamic_module_config:
            name: cluster-async-router
          filter_name: body-router-writer
          filter_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{}'
  - type: "type.googleapis.com/envoy.config.cluster.v3.Cluster"
    name: "{{.ClusterName}}"
    operation:
      op: replace
      path: ""
      value:
        name: "{{.ClusterName}}"
        connect_timeout: 5s
        lb_policy: CLUSTER_PROVIDED
        # Pin HTTP/1.1 explicitly. EG's generated cluster has this set; when we
        # replace the cluster wholesale we have to restate it so Envoy doesn't
        # fall back to inference (which can fail validation for dynamic-module
        # clusters). cluster-router-eg uses the same shape; the only difference
        # is we don't add any upstream HTTP filters, so the http_filters list
        # is omitted here — cluster-async-router has no auth-injection filter.
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http_protocol_options: {}
        # Per-host TLS personalities. Hosts c and d carry sni metadata under
        # the envoy.transport_socket_match namespace (HostSpec.Metadata in the
        # SDK). Envoy matches metadata against the entries below and applies
        # the corresponding UpstreamTlsContext. Hosts a/b carry no sni metadata
        # and fall through to the cluster's default transport_socket (none →
        # plaintext).
        transport_socket_matches:
        - name: host-c
          match: { sni: host-c.test }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: host-c.test
              common_tls_context:
                validation_context:
                  trusted_ca: { filename: /etc/envoy/tls/ca.pem }
                  match_typed_subject_alt_names:
                  - san_type: DNS
                    matcher: { exact: host-c.test }
        - name: host-d
          match: { sni: host-d.test }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: host-d.test
              common_tls_context:
                validation_context:
                  trusted_ca: { filename: /etc/envoy/tls/ca.pem }
                  match_typed_subject_alt_names:
                  - san_type: DNS
                    matcher: { exact: host-d.test }
        cluster_type:
          name: envoy.clusters.dynamic_modules
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
            dynamic_module_config:
              name: cluster-async-router
            cluster_name: body-router-cluster
            cluster_config:
              "@type": type.googleapis.com/google.protobuf.StringValue
              value: '{"hosts":[{"name":"a","address":"upstream-a.default.svc.cluster.local:8080"},{"name":"b","address":"upstream-b.default.svc.cluster.local:8080"},{"name":"c","address":"upstream-c.default.svc.cluster.local:8443","sni":"host-c.test"},{"name":"d","address":"upstream-d.default.svc.cluster.local:8443","sni":"host-d.test"}]}'
