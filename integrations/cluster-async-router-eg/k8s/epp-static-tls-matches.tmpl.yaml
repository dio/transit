# EnvoyPatchPolicy variant: e2e-static-tls-matches strategy.
#
# Bucket-keyed static transport_socket_matches: two static buckets
# ("tls-internal-ca" and "plaintext") are selected via host metadata rather
# than a per-host sni entry. auto_host_sni reads the per-host hostname from the
# patched ABI (HostSpec.Hostname → spec.Hostname), so no hardcoded sni value is
# needed inside each UpstreamTlsContext.
#
# Cluster config JSON:
#   a/b  → bucket=plaintext          (no sni needed)
#   c/d  → bucket=tls-internal-ca, sni=host-c.test / sni=host-d.test
#           (sni sets HostSpec.Hostname for auto_host_sni)
#
# ClusterName is the XDSNameSchemeV2 cluster name discovered at e2e time from
# Envoy admin /config_dump (usually
# httproute/default/cluster-async-router/rule/0).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: cluster-async-router
  namespace: default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: cluster-async-router
  type: JSONPatch
  jsonPatches:
  - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
    name: tcp-80
    operation:
      op: add
      path: "/default_filter_chain/filters/0/typed_config/http_filters/0"
      value:
        name: body-router-writer
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
          dynamic_module_config:
            name: cluster-async-router
          filter_name: body-router-writer
          filter_config:
            "@type": type.googleapis.com/google.protobuf.StringValue
            value: '{}'
  - type: "type.googleapis.com/envoy.config.cluster.v3.Cluster"
    name: "{{.ClusterName}}"
    operation:
      op: replace
      path: ""
      value:
        name: "{{.ClusterName}}"
        connect_timeout: 5s
        lb_policy: CLUSTER_PROVIDED
        # Pin HTTP/1.1 explicitly — same rationale as epp.tmpl.yaml.
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http_protocol_options: {}
        # Two static buckets replace the per-host sni entries in epp.tmpl.yaml.
        # Hosts carry "bucket" metadata (set via HostSpec.Metadata["bucket"]);
        # Envoy matches that field here and applies the right socket factory.
        # auto_host_sni reads HostSpec.Hostname (set via the sni field in the
        # cluster config JSON) at connect time — no hardcoded sni per entry.
        transport_socket_matches:
        - name: tls-internal-ca
          match: { bucket: tls-internal-ca }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              auto_host_sni: true
              auto_sni_san_validation: true
              common_tls_context:
                validation_context:
                  trusted_ca: { filename: /etc/envoy/tls/ca.pem }
        - name: plaintext
          match: { bucket: plaintext }
          transport_socket:
            name: envoy.transport_sockets.raw_buffer
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer
        cluster_type:
          name: envoy.clusters.dynamic_modules
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_modules.v3.ClusterConfig
            dynamic_module_config:
              name: cluster-async-router
            cluster_name: body-router-cluster
            cluster_config:
              "@type": type.googleapis.com/google.protobuf.StringValue
              value: '{"hosts":[{"name":"a","address":"upstream-a.default.svc.cluster.local:8080","bucket":"plaintext"},{"name":"b","address":"upstream-b.default.svc.cluster.local:8080","bucket":"plaintext"},{"name":"c","address":"upstream-c.default.svc.cluster.local:8443","sni":"host-c.test","bucket":"tls-internal-ca"},{"name":"d","address":"upstream-d.default.svc.cluster.local:8443","sni":"host-d.test","bucket":"tls-internal-ca"}]}'
