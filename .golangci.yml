version: "2"

formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - nilerr
    - prealloc
    - unparam
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
      - path: "up/testutil/"
        linters:
          - unparam
      - path: "examples/"
        linters:
          - unparam
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - shadow          # too noisy for filter code
        - fieldalignment  # hand-tuned layouts
