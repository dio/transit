version: "2"

formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/dio/transit)

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - nilerr
    - prealloc
    - unparam
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
      - path: "up/testutil/"
        linters:
          - unparam
      - path: "_bench_test\\.go"
        linters:
          - govet
      - path: "examples/"
        linters:
          - unparam
      - path: "e2e/"
        linters:
          - unparam
      - linters:
          - errcheck
        text: "Error return value of `fmt\\.(Print|Println|Printf|Fprint|Fprintln|Fprintf)` is not checked"
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - shadow          # too noisy for filter code
        - fieldalignment  # hand-tuned layouts
