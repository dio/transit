name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# SHAs pinned to latest tags as of 2026-05-22:
#   actions/checkout@v6.0.2   de0fac2e4500dabe0009e67214ff5f5447ce83dd
#   actions/setup-go@v6.4.0   4a3601121dd01d1626a1e23e37211e3254c1c06c
#   actions/cache@v5.0.5      27d5ce7f107fe9357f9df03efb73ab90386fccae
# golangci-lint pinned in tools/go.mod via `tool` directive

env:
  CGO_ENABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # lint: make format-check + make lint (covers root and examples modules)
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - run: make format-check
      - run: make lint

  # ---------------------------------------------------------------------------
  # test: make vet + make test (root) + examples unit tests
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - run: make vet
      - run: make test

      - name: examples unit tests
        run: cd examples && GOWORK=off go test ./...

  # ---------------------------------------------------------------------------
  # e2e: all integration test suites against dev Envoy
  # Dev Envoy is fetched from archive.tetratelabs.io/envoy/download/dev/;
  # the cache key is pinned to the dev commitSha from envoy-versions.json so
  # it refreshes automatically when a new dev build is published.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: resolve dev envoy commit
        id: envoy
        run: |
          SHA=$(curl -fsSL https://archive.tetratelabs.io/envoy/envoy-versions.json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['dev']['commitSha'])")
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: cache envoy
        id: cache-envoy
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .bin/envoy
          key: envoy-dev-${{ steps.envoy.outputs.sha }}-linux-amd64

      - name: download envoy
        if: steps.cache-envoy.outputs.cache-hit != 'true'
        run: make download-envoy-dev

      - run: make e2e
      - run: make e2e-hello
      - run: make e2e-sse-tap
      - run: make e2e-request-ui
      - run: make e2e-lb-policy
